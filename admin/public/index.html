<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة التوليد — ميجا نت</title>
<style>
  :root {
    --bg: #0b0f1a; --panel: #111827; --panel2: #1a2333; --line: #26324a;
    --text: #e5e9f2; --muted: #8b99b3; --acc: #22c55e; --acc2: #16a34a;
    --danger: #ef4444; --warn: #f59e0b; --radius: 12px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
  /* Sidebar */
  aside { width: 280px; height: 100vh; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  .brand { padding: 16px 18px; border-bottom: 1px solid var(--line); font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 8px var(--acc); }
  .searchbox { padding: 8px 8px 4px; flex-shrink: 0; }
  .searchbox input { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 8px 10px; font-size: 13px; font-family: inherit; }
  .searchbox input:focus { outline: none; border-color: var(--acc); }
  #profileList { flex: 1; overflow-y: auto; padding: 8px; min-height: 0; }
  .profile-item { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding: 10px 10px; border-radius: var(--radius); cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; }
  .profile-item:hover { background: var(--panel2); }
  .profile-item.active { background: var(--panel2); border-color: var(--acc); }
  .profile-item .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
  .profile-item .pact { opacity: .75; display: flex; gap: 2px; flex-shrink: 0; }
  .profile-item:hover .pact { opacity: 1; }
  .iconbtn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 14px; padding: 2px 5px; border-radius: 6px; }
  .iconbtn:hover { background: rgba(255,255,255,.06); color: var(--text); }
  .iconbtn.danger:hover { color: var(--danger); }
  .newbtn { margin: 4px 8px; padding: 10px; border-radius: var(--radius); border: 1px dashed var(--line); background: transparent; color: var(--muted); cursor: pointer; font-weight: 600; font-size: 13px; flex-shrink: 0; }
  .newbtn:hover { border-color: var(--acc); color: var(--acc); }
  /* Main */
  main { flex: 1; height: 100vh; display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
  header.top { flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  #profileTitle { font-size: 17px; font-weight: 700; flex: 1; min-width: 140px; }
  .badge { font-size: 12px; color: var(--muted); background: var(--panel2); padding: 4px 10px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
  .badge.dirty { color: #fde68a; background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.45); display: none; }
  .badge.dirty.show { display: inline-flex; }
  .badge.wcag-pass { color: #86efac; background: rgba(34,197,94,.14); border: 1px solid rgba(34,197,94,.4); }
  .badge.wcag-warn { color: #fde68a; background: rgba(245,158,11,.15); border: 1px solid rgba(245,158,11,.4); }
  .badge.wcag-fail { color: #fca5a5; background: rgba(239,68,68,.15); border: 1px solid rgba(239,68,68,.4); }
  .btn { border: none; border-radius: 10px; padding: 9px 16px; font-weight: 600; cursor: pointer; font-size: 13px; font-family: inherit; }
  .btn.primary { background: var(--acc); color: #052e16; }
  .btn.primary:hover { background: var(--acc2); }
  .btn.ghost { background: var(--panel2); color: var(--text); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--muted); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  /* Bundle Size & Flash Meter */
  #bundleMeter { flex-shrink: 0; display: none; align-items: center; gap: 14px; padding: 8px 22px; background: rgba(26,35,51,.75); border-bottom: 1px solid var(--line); font-size: 12px; flex-wrap: wrap; }
  #bundleMeter.show { display: flex; }
  .flash-bar { width: 130px; height: 8px; background: var(--panel); border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
  .flash-fill { height: 100%; background: var(--acc); transition: width .3s ease; }
  /* Tabs & Workspace Split */
  .tabs { flex-shrink: 0; display: flex; gap: 4px; padding: 8px 20px 0; background: var(--panel); flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .tab { padding: 9px 15px; border-radius: 10px 10px 0 0; background: transparent; color: var(--muted); border: none; cursor: pointer; font-weight: 600; font-size: 13px; font-family: inherit; }
  .tab.active { background: var(--bg); color: var(--text); }
  .workspace-body { flex: 1; display: flex; min-height: 0; height: 100%; overflow: hidden; }
  .content { flex: 1; height: 100%; overflow-y: auto; padding: 20px; min-width: 0; }
  /* Split-Screen Live Simulator */
  #simulatorPanel { position: relative; width: 400px; min-width: 280px; max-width: 860px; height: 100%; background: var(--panel); border-right: 1px solid var(--line); display: none; flex-direction: column; flex-shrink: 0; overflow: hidden; }
  #simulatorPanel.open { display: flex; }
  #simulatorPanel.expanded { width: 640px !important; }
  #simResizer { position: absolute; top: 0; right: 0; bottom: 0; width: 7px; cursor: ew-resize; z-index: 20; transition: background .15s; }
  #simResizer:hover, #simResizer.dragging { background: rgba(34,197,94,.45); }
  .sim-head { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 6px; font-weight: 700; font-size: 13px; flex-shrink: 0; flex-wrap: wrap; }
  .sim-actions { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .sim-zoom-badge { font-size: 11px; min-width: 40px; text-align: center; color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .sim-controls { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; background: var(--panel2); flex-shrink: 0; }
  .sim-pages { display: flex; flex-wrap: wrap; gap: 4px; }
  .sim-page-btn { background: var(--panel); border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 4px 8px; font-size: 11px; cursor: pointer; font-family: inherit; }
  .sim-page-btn.active { border-color: var(--acc); color: var(--acc); font-weight: 700; }
  .sim-row { display: flex; gap: 6px; align-items: center; }
  .sim-row select { flex: 1; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 5px 8px; font-size: 12px; font-family: inherit; min-width: 0; }
  .sim-viewport { flex: 1; display: flex; align-items: flex-start; padding: 14px; overflow: auto; background: #070a12; min-height: 0; direction: ltr; }
  #simStageWrap { position: relative; flex-shrink: 0; margin: 0 auto; }
  #simStage { position: absolute; top: 0; left: 0; transform-origin: top left; }
  .phone-bezel { width: 340px; height: 640px; background: #000; border: 7px solid #26324a; border-radius: 28px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 16px 40px rgba(0,0,0,.6); }
  .phone-bezel.tablet { border-radius: 18px; }
  .phone-notch { height: 18px; background: #111827; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .phone-bezel.tablet .phone-notch { height: 12px; }
  .phone-notch::after { content: ""; width: 64px; height: 5px; border-radius: 99px; background: #26324a; }
  #simFrame { flex: 1; width: 100%; height: 100%; border: none; background: #020617; }
  .file-picker-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
  .file-picker-name { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 280px; }
  /* Cards & Forms */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; }
  .card h3 { font-size: 14px; color: var(--muted); margin-bottom: 14px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 9px 12px; font-size: 14px; font-family: inherit; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--acc); }
  .field textarea { resize: vertical; min-height: 70px; }
  .codearea { font-family: ui-monospace, SFMono-Regular, Consolas, monospace !important; font-size: 12px !important; direction: ltr; text-align: left; min-height: 220px !important; line-height: 1.55; }
  .hint { font-size: 11px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
  .colorrow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .colorrow input[type=color] { width: 44px; height: 38px; padding: 2px; background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; cursor: pointer; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; border: 1px solid var(--line); }
  /* Presets Gallery */
  .preset-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; margin-top: 12px; }
  .preset-card { background: var(--panel2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; cursor: pointer; transition: all .15s ease; display: flex; flex-direction: column; gap: 8px; text-align: right; }
  .preset-card:hover { border-color: var(--muted); transform: translateY(-2px); }
  .preset-card.active { border-color: var(--acc); background: rgba(34,197,94,.09); box-shadow: 0 0 10px rgba(34,197,94,.2); }
  .preset-card-top { display: flex; align-items: center; justify-content: space-between; }
  .preset-card-title { font-size: 13px; font-weight: 700; color: var(--text); }
  .preset-swatches { display: flex; gap: 6px; align-items: center; }
  .preset-swatch-dot { width: 18px; height: 18px; border-radius: 50%; border: 1px solid rgba(255,255,255,.2); box-shadow: 0 2px 4px rgba(0,0,0,.3); }
  .preset-meta-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
  .preset-tag { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--panel); color: var(--muted); border: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  th { font-size: 12px; color: var(--muted); text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  td { padding: 6px; border-bottom: 1px solid var(--line); }
  td input, td select { background: var(--panel2); border: 1px solid var(--line); color: var(--text); border-radius: 7px; padding: 7px 9px; font-size: 13px; width: 100%; font-family: inherit; }
  .rowbtn { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; font-family: inherit; }
  .rowbtn:hover { border-color: var(--danger); color: var(--danger); }
  .addbtn { margin-top: 8px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--acc); color: var(--text); padding: 12px 22px; border-radius: 12px; font-size: 14px; display: none; z-index: 50; }
  .toast.error { border-color: var(--danger); }
  .toast.show { display: block; animation: fade .25s; }
  @keyframes fade { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
  .errorbox { background: rgba(239,68,68,.1); border: 1px solid var(--danger); color: #fca5a5; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; font-size: 13px; white-space: pre-line; }
  .planshint { font-size: 12px; color: var(--muted); margin: 8px 0; }
  .status { font-size: 12px; color: var(--muted); }
  .status.ok { color: var(--acc); }
  .qr-preview-box { display: flex; align-items: center; gap: 16px; padding: 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; flex-wrap: wrap; }
  .qr-svg-wrap { width: 112px; height: 112px; background: #fff; border-radius: 10px; padding: 6px; display: flex; align-items: center; justify-content: center; }
  .qr-svg-wrap svg { width: 100%; height: 100%; }
  .brand-preview-row { display: flex; align-items: center; gap: 18px; padding: 14px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>

<aside>
  <div class="brand"><span class="dot"></span> بوابة التوليد</div>
  <div class="searchbox">
    <input id="profileSearch" type="search" placeholder="🔍 تصفية البروفايلات..." oninput="renderProfileList()">
  </div>
  <div id="profileList"></div>
  <button class="newbtn" onclick="createProfile()">＋ بريفايل جديد</button>
  <button class="newbtn" onclick="batchBuildAll()" id="batchBuildBtn">⚡ بناء جميع البروفايلات</button>
  <button class="newbtn" onclick="exportProfile()">⬇ تصدير البروفايل الحالي</button>
  <button class="newbtn" onclick="importProfile()">⬆ استيراد بروفايل</button>
</aside>

<main>
  <header class="top">
    <div id="profileTitle">اختر بريفايل</div>
    <span class="badge dirty" id="dirtyBadge" title="توجد تعديلات غير محفوظة (Ctrl+S للحفظ)">● تعديلات غير محفوظة</span>
    <span class="badge" id="profileMeta"></span>
    <button class="btn ghost" onclick="saveConfig()" id="saveBtn" title="حفظ (Ctrl+S)">حفظ</button>
    <button class="btn primary" onclick="buildAndDownload()">بناء وتحميل zip</button>
    <button class="btn ghost" onclick="toggleSimulator()" id="simToggleBtn">📱 المحاكي المدمج</button>
    <button class="btn ghost" onclick="togglePreview()" id="previewBtn">معاينة خارجية</button>
  </header>

  <div id="bundleMeter">
    <strong id="bm-title">📦 حجم الحزمة:</strong>
    <span class="badge" id="bm-zip">ZIP: —</span>
    <span class="badge" id="bm-raw">Raw: —</span>
    <div class="flash-bar" title="ميزانية ذاكرة الفلاش في الراوتر (1 MB)"><div class="flash-fill" id="bm-bar" style="width:0%"></div></div>
    <span id="bm-breakdown" class="status"></span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="workspace-body">
    <div class="content" id="content"></div>

    <section id="simulatorPanel" aria-label="محاكي البوابة المباشر">
      <div id="simResizer" title="اسحب لتكبير أو تصغير عرض المعاينة"></div>
      <div class="sim-head">
        <span>📱 المعاينة المباشرة</span>
        <div class="sim-actions">
          <button class="rowbtn" id="simZoomOut" onclick="stepSimZoom(-10)" title="تصغير المعاينة">−</button>
          <span id="simZoomLabel" class="sim-zoom-badge">100%</span>
          <button class="rowbtn" id="simZoomIn" onclick="stepSimZoom(10)" title="تكبير المعاينة">+</button>
          <button class="rowbtn" id="simZoomReset" onclick="setSimZoom(100)" title="الحجم الطبيعي (100%)">1:1</button>
          <button class="rowbtn" id="simExpandBtn" onclick="toggleSimExpand()" title="توسيع / تضييق نافذة المعاينة">⛶</button>
          <button class="rowbtn" onclick="refreshSimulator(true)" title="إعادة البناء وتحديث المعاينة">🔄</button>
          <button class="rowbtn" onclick="toggleSimulator()" title="إغلاق">✕</button>
        </div>
      </div>
      <div class="sim-controls">
        <div class="sim-pages" id="simPagesBar"></div>
        <div class="sim-row">
          <select id="sim-scenario" onchange="updateSimulatorFrame()">
            <option value="normal">السيناريو: عادي (متصل)</option>
            <option value="error">السيناريو: رسالة خطأ RADIUS</option>
            <option value="trial">السيناريو: فترة تجريبية (Trial)</option>
            <option value="chap">السيناريو: تشفير CHAP</option>
          </select>
          <select id="sim-lang" onchange="updateSimulatorFrame()">
            <option value="ar">اللغة: العربية (RTL)</option>
            <option value="en">Language: English (LTR)</option>
          </select>
        </div>
        <div class="sim-row">
          <select id="sim-theme" aria-label="ثيم المعاينة" onchange="setSimTheme(this.value)">
            <option value="auto">الثيم: افتراضي البروفايل</option>
            <option value="dark">الثيم: داكن (Dark)</option>
            <option value="light">الثيم: نهاري (Light)</option>
          </select>
          <select id="sim-device" aria-label="حجم شاشة المعاينة" onchange="setSimDevice(this.value)">
            <option value="mobile">الشاشة: موبايل ضيق (340px)</option>
            <option value="wide">الشاشة: موبايل عريض (412px)</option>
            <option value="tablet">الشاشة: تابلت (768px)</option>
          </select>
        </div>
      </div>
      <div class="sim-viewport">
        <div id="simStageWrap">
          <div id="simStage">
            <div class="phone-bezel" id="simBezel">
              <div class="phone-notch"></div>
              <iframe id="simFrame" title="معاينة البوابة"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
'use strict';
// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
const state = {
  profiles: [],
  current: null,
  meta: null,
  tab: 'general',
  buildBusy: false,
  dirty: false,
  drafts: {},
  sim: {
    open: false,
    baseUrl: null,
    page: 'login',
    scenario: 'normal',
    lang: 'ar',
    theme: 'auto',
    device: 'mobile',
    zoom: 100,
    expanded: false
  }
};

const SIM_DEVICES = {
  mobile: { id: 'mobile', label: 'موبايل ضيق (340px)', width: 340, height: 640 },
  wide: { id: 'wide', label: 'موبايل عريض (412px)', width: 412, height: 732 },
  tablet: { id: 'tablet', label: 'تابلت (768px)', width: 768, height: 900 }
};

const SIM_PAGES = [
  { id: 'login', label: 'الدخول' },
  { id: 'status', label: 'الحالة' },
  { id: 'plans', label: 'الباقات' },
  { id: 'logout', label: 'الخروج' },
  { id: 'expired', label: 'الانتهاء' },
  { id: 'error', label: 'الخطأ' },
  { id: 'alogin', label: 'التحويل' },
  { id: 'index', label: 'الرئيسية' }
];

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

function toast(msg, isError) {
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show' + (isError ? ' error' : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.className = 'toast'; }, 3200);
}

function markDirty(isDirty) {
  state.dirty = Boolean(isDirty);
  const badge = $('#dirtyBadge');
  if (badge) badge.className = 'badge dirty' + (state.dirty ? ' show' : '');
}

// Track form edits in #content to light up Dirty State indicator
document.addEventListener('input', (e) => {
  if (state.current && $('#content') && $('#content').contains(e.target)) {
    if (!e.target.dataset.ignoreDirty) markDirty(true);
  }
});

// Keyboard shortcut Ctrl+S / Cmd+S to save
window.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (state.current) saveConfig();
  }
});

window.addEventListener('beforeunload', (e) => {
  if (state.dirty) {
    e.preventDefault();
    e.returnValue = '';
  }
});

async function api(path, options) {
  const res = await fetch('/api' + path, Object.assign({ headers: { 'Content-Type': 'application/json' } }, options));
  let data = null;
  try { data = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error((data && data.error) || ('HTTP ' + res.status));
    // the server's 422 carries the per-field validation errors — carry them
    // on the thrown error so the UI can render the inline error box
    if (data && data.validationErrors) err.validationErrors = data.validationErrors;
    throw err;
  }
  return data;
}

// ---------------------------------------------------------------------------
// Load meta + profiles
// ---------------------------------------------------------------------------
async function boot() {
  try {
    renderSimPagesBar();
    state.meta = await api('/meta');
    await loadProfiles();
  } catch (e) { toast('فشل التحميل: ' + e.message, true); }
}

async function loadProfiles(selectId) {
  const data = await api('/profiles');
  state.profiles = data.profiles;
  renderProfileList(selectId);
}

function renderProfileList(selectId) {
  const list = $('#profileList');
  const query = ($('#profileSearch')?.value || '').trim().toLowerCase();
  list.innerHTML = '';
  const filtered = state.profiles.filter(p =>
    !query || p.name.toLowerCase().includes(query) || p.id.toLowerCase().includes(query)
  );
  for (const p of filtered) {
    const row = document.createElement('div');
    row.className = 'profile-item' + (state.current && state.current.id === p.id ? ' active' : '');
    row.innerHTML =
      '<span class="pname" title="' + esc(p.name) + ' (' + esc(p.id) + ')">' + esc(p.name) + '</span>' +
      '<span class="pact">' +
      '<button class="iconbtn" title="نسخ" onclick="event.stopPropagation();duplicateProfile(\'' + p.id + '\')">⧉</button>' +
      '<button class="iconbtn" title="إعادة تسمية" onclick="event.stopPropagation();renameProfile(\'' + p.id + '\')">✎</button>' +
      '<button class="iconbtn danger" title="حذف" onclick="event.stopPropagation();deleteProfile(\'' + p.id + '\')">🗑</button>' +
      '</span>';
    row.onclick = () => selectProfile(p.id);
    list.appendChild(row);
  }
  const targetId = selectId || (!state.current && state.profiles.length > 0 ? state.profiles[0].id : null);
  if (targetId) selectProfile(targetId);
}

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

async function selectProfile(id, skipDirtyCheck) {
  if (!skipDirtyCheck && state.dirty && state.current && state.current.id !== id) {
    if (!confirm('لديك تعديلات غير محفوظة في البروفايل الحالي. هل تريد المتابعة وتجاهلها؟')) return;
  }
  try {
    state.drafts = {};
    markDirty(false);
    const data = await api('/profiles/' + encodeURIComponent(id));
    state.current = data.profile;
    lastRouterFingerprint = (state.current && state.current.mikrotik && state.current.mikrotik.tlsFingerprint) || '';
    $('#profileTitle').textContent = state.current.name;
    $('#profileMeta').textContent =
      state.current.assets.length + ' أصول · آخر تحديث ' + (state.current.updatedAt || '').slice(0, 10);
    renderProfileList();
    renderTabs();
    renderTab();
    if (state.sim.open) refreshSimulator(true);
  } catch (e) { toast(e.message, true); }
}

  { id: 'theme', label: 'الثيم' },

];

function renderTabs() {
  $('#tabs').innerHTML = TABS.map(t =>
    '<button class="tab' + (state.tab === t.id ? ' active' : '') + '" onclick="setTab(\'' + t.id + '\')">' + t.label + '</button>'
  ).join('');

function setTab(id) {
  // capture the tab we are leaving into drafts BEFORE re-rendering (the DOM
  // of the outgoing tab is about to be destroyed)
  if (state.tab !== id) captureDraft(state.tab);
  state.tab = id;
  renderTabs();
  renderTab();
}

// Snapshot the current tab's field values (its DOM is still present). Used so
// Save always applies EVERY tab's edits, not just the visible one.
function captureDraft(tab) {
  try {
    if (tab === 'general') {
      state.drafts.general = {
        networkName: $('#g-network').value.trim(),
        poweredByText: $('#g-powered-text').value,
        poweredByName: $('#g-powered-name').value,
        poweredByUrl: $('#g-powered-url').value
      };
    } else if (tab === 'theme') {
      state.drafts.theme = {
        preset: $('#t-preset').value,
        defaultTheme: $('#t-default').value,
        primaryColor: $('#t-primary').value,
        backgroundColor: $('#t-bg').value,
        cardRadius: $('#t-radius').value.trim(),
        enableNetworkBackground: $('#t-canvas').value // '' = let the preset decide
      };
    } else if (tab === 'features') {
      state.drafts.features = {
        loginMode: $('#f-login').value,
        voucherPasswordMode: $('#f-pass').value,
        enableQRScanner: $('#f-qr').value === 'true',
        qrScannerUrl: $('#f-qrurl').value.trim(),
        voucherMinLength: $('#f-min').value,
        enableLanguageToggle: $('#f-lang').value === 'true',
        enableClonePrevention: $('#f-clone').value === 'true',
        enableSmartAssistant: $('#f-smart').value === 'true',
        quotaDisplayFormat: $('#f-quota').value,
        kbBase: parseInt($('#f-kb').value, 10),
        enableTechDetails: $('#f-tech').value === 'true',
        security: {
          maxAttempts: parseInt($('#f-sec-max').value, 10) || 5,
          blockDurationMinutes: parseInt($('#f-sec-block').value, 10) || 2
        }
      };
    } else if (tab === 'plans') {
      const rows = [];
      $$('tr', $('#content')).forEach(tr => {
        const idx = tr.querySelector('input[data-i]');
        if (!idx) return;
        const i = parseInt(idx.dataset.i, 10);
        const row = { i };
        for (const input of $$('input[data-i]', tr)) row[input.dataset.k] = input.value.trim();
        const icon = tr.querySelector('select[data-k="icon"]');
        if (icon) row.icon = icon.value;
        rows.push(row);
      });
      state.drafts.plans = rows;
    } else if (tab === 'support') {
      const agents = [];
      state.current.config.support = state.current.config.support || { agents: [] };
      state.current.config.support.agents.forEach((agent, i) => {
        agents.push({
          i,
          name: $('#s-name-' + i).value.trim(),
          role: $('#s-role-' + i).value.trim(),
          phone: $('#s-phone-' + i).value.trim(),
          whatsapp: $('#s-wa-' + i).value.trim(),
          image: $('#s-img-' + i).value
        });
      });
      state.drafts.support = agents;
    } else if (tab === 'announcements') {
      const activeEl = $('#a-active');
      const typeEl = $('#a-type');
      const enEl = $('#a-en');
      const arEl = $('#a-ar');
      if (activeEl && typeEl && enEl && arEl) {
        state.drafts.announcements = {
          active: activeEl.value === 'true',
          type: typeEl.value,
          message_en: enEl.value.split('\n').map(s => s.trim()).filter(Boolean),
          message_ar: arEl.value.split('\n').map(s => s.trim()).filter(Boolean)
        };
      }
    } else if (tab === 'words') {
      const overrides = {};
      $$('#words-list .card').forEach(row => {
        const key = row.querySelector('.w-key')?.value;
        const en = row.querySelector('.w-en')?.value?.trim() || '';
        const ar = row.querySelector('.w-ar')?.value?.trim() || '';
        if (key && (en || ar)) {
          overrides[key] = { en, ar };
        }
      });
      state.drafts.words = overrides;

      const radiusErrors = {};
      $$('#radius-errors-list .r-row').forEach(row => {
        const k = row.querySelector('.r-key')?.value?.trim();
        const v = row.querySelector('.r-val')?.value?.trim();
        if (k && !k.startsWith('_') && v) {
          radiusErrors[k] = v;
        }
      });
      state.drafts.radiusErrors = radiusErrors;
    }
  } catch (err) { /* element not present — skip draft for this tab */ }
}

function applyDrafts(c) {
  const d = state.drafts;

  if (d.general) {
    if (d.general.networkName) c.general.networkName = d.general.networkName;
    c.general.poweredByText = d.general.poweredByText;
    c.general.poweredByName = d.general.poweredByName;
    c.general.poweredByUrl = d.general.poweredByUrl;
  }

  if (d.theme) {
    if (d.theme.preset) c.theme.preset = d.theme.preset; else delete c.theme.preset;
    if (d.theme.defaultTheme) c.theme.defaultTheme = d.theme.defaultTheme;
    else delete c.theme.defaultTheme;
    c.theme.primaryColor = d.theme.primaryColor;
    c.theme.backgroundColor = d.theme.backgroundColor;
    // an empty radius means "let the preset supply it" (schema: required only
    // without a preset)
    if (d.theme.cardRadius) c.theme.cardRadius = d.theme.cardRadius;
    else delete c.theme.cardRadius;
    if (d.theme.enableNetworkBackground === '') delete c.theme.enableNetworkBackground;
    else c.theme.enableNetworkBackground = d.theme.enableNetworkBackground === 'true';
  }

  if (d.features) {
    c.features.loginMode = d.features.loginMode;
    c.features.voucherPasswordMode = d.features.voucherPasswordMode;
    c.features.enableQRScanner = d.features.enableQRScanner;
    if (d.features.qrScannerUrl) c.features.qrScannerUrl = d.features.qrScannerUrl;
    else delete c.features.qrScannerUrl;
    const min = d.features.voucherMinLength;
    if (min === '') delete c.features.voucherMinLength; else c.features.voucherMinLength = parseInt(min, 10);
    c.features.enableLanguageToggle = d.features.enableLanguageToggle;
    c.features.enableClonePrevention = d.features.enableClonePrevention;
    c.features.enableSmartAssistant = d.features.enableSmartAssistant;
    c.features.quotaDisplayFormat = d.features.quotaDisplayFormat;
    c.features.kbBase = d.features.kbBase;
    c.features.enableTechDetails = d.features.enableTechDetails;
    c.security = c.security || {};
    c.security.maxAttempts = d.features.security.maxAttempts;
    c.security.blockDurationMinutes = d.features.security.blockDurationMinutes;
  }

  if (d.plans) {
    for (const row of d.plans) {
      const plan = c.plans[row.i];
      if (!plan) continue;
      for (const k of ['name', 'name_ar', 'quota', 'quota_ar', 'price']) {
        if (row[k] !== undefined) plan[k] = row[k];
      }
      if (row.icon) plan.icon = row.icon; else delete plan.icon;
    }
  }

  if (d.support && c.support && c.support.agents) {
    for (const a of d.support) {
      const agent = c.support.agents[a.i];
      if (!agent) continue;
      agent.name = a.name;
      agent.role = a.role;
      agent.phone = a.phone;
      agent.whatsapp = a.whatsapp;
      if (a.image) agent.image = a.image; else delete agent.image;
    }
  }

  if (d.words !== undefined) {
    if (Object.keys(d.words).length > 0) {
      c.i18nOverrides = d.words;
    } else {
      delete c.i18nOverrides;
    }
  }

  if (d.radiusErrors !== undefined) {
    c.radiusErrorTranslations = d.radiusErrors;
  }
}

function renderTab() {
  const c = state.current.config;
  const el = $('#content');
  el.innerHTML = '';
  switch (state.tab) {
    case 'general': el.appendChild(formGeneral(c)); break;
    case 'theme': el.appendChild(formTheme(c)); break;
    case 'features': el.appendChild(formFeatures(c)); break;
    case 'plans': el.appendChild(formPlans(c)); break;
    case 'support': el.appendChild(formSupport(c)); break;
    case 'announcements': el.appendChild(formAnnouncements()); break;
    case 'words': el.appendChild(formWords()); break;

    case 'assets': el.appendChild(formAssets()); break;

  }
}

// ---------------------------------------------------------------------------
// WCAG 2.1 Live Contrast Calculator
// ---------------------------------------------------------------------------
function hexLuminance(hex) {
  if (!/^#[0-9a-fA-F]{6}$/.test(hex || '')) return 0;
  const rgb = [
    parseInt(hex.slice(1, 3), 16) / 255,
    parseInt(hex.slice(3, 5), 16) / 255,
    parseInt(hex.slice(5, 7), 16) / 255
  ].map(v => (v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4)));
  return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
}

function computeWcag(hex1, hex2) {
  const l1 = hexLuminance(hex1);
  const l2 = hexLuminance(hex2);
  const ratio = Math.round(((Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05)) * 100) / 100;
  if (ratio >= 7) return { ratio, level: 'AAA', text: 'تباين ' + ratio + ':1 · AAA ممتاز', cls: 'wcag-pass' };
  if (ratio >= 4.5) return { ratio, level: 'AA', text: 'تباين ' + ratio + ':1 · AA جيد', cls: 'wcag-pass' };
  if (ratio >= 3) return { ratio, level: 'AA-Large', text: 'تباين ' + ratio + ':1 · AA للعناوين فقط', cls: 'wcag-warn' };
  return { ratio, level: 'FAIL', text: '⚠ تباين ضعيف (' + ratio + ':1)', cls: 'wcag-fail' };
}

function applyPresetToInputs(presetId) {
  const id = presetId || $('#t-preset')?.value;
  if (!id) return;
  const p = state.meta?.presets?.find(x => x.id === id);
  if (!p) return;
  if ($('#t-preset')) $('#t-preset').value = id;
  if (p.preview && p.preview.colors) {
    if ($('#t-primary')) $('#t-primary').value = p.preview.colors[0];
    if ($('#t-bg')) $('#t-bg').value = p.preview.colors[1];
  }
  if (p.preview && p.preview.radius && $('#t-radius')) {
    $('#t-radius').value = p.preview.radius;
  }
  if (p.theme) {
    if (p.theme.defaultTheme && $('#t-default')) {
      $('#t-default').value = p.theme.defaultTheme;
    }
    if (p.theme.enableNetworkBackground !== undefined && $('#t-canvas')) {
      $('#t-canvas').value = String(p.theme.enableNetworkBackground);
    }
  }
  document.querySelectorAll('.preset-card').forEach(c => {
    c.classList.toggle('active', c.dataset.presetId === id);
  });
  const prim = $('#t-primary')?.value;
  const bg = $('#t-bg')?.value;
  if ($('#t-primary-swatch')) $('#t-primary-swatch').style.background = prim;
  if ($('#t-bg-swatch')) $('#t-bg-swatch').style.background = bg;
  const wcag = computeWcag(prim, bg);
  const badge = $('#wcag-badge');
  if (badge) {
    badge.textContent = wcag.text;
    badge.className = 'badge ' + wcag.cls;
    badge.dataset.level = wcag.level;
  }
  const box = $('#preset-preview');
  if (box && p.preview && p.preview.colors) {
    box.innerHTML = p.preview.colors.map(col =>
      '<span class="swatch" style="display:inline-block;background:' + esc(col) + ';width:22px;height:22px;margin-inline-end:6px;vertical-align:middle"></span>'
    ).join('') + '<span class="badge">حواف ' + esc(p.preview.radius) + '</span>';
  }
  markDirty(true);
  toast('تم تطبيق بريسيت: ' + p.label);
}

async function saveCurrentAsPreset() {
  if (!state.current) return;
  const id = prompt('معرّف الشخصية (إنجليزي):', state.current.id + '-style');
  if (!id) return;
  try {
    captureDraft(state.tab);
    await saveConfig(true);
    const data = await api('/presets', {
      method: 'POST',
      body: JSON.stringify({ slug: state.current.id, id, label: state.current.name + ' — شخصية مخصصة' })
    });
    toast('تم حفظ الشخصية: ' + data.id);
    state.meta = await api('/meta'); // refresh the presets list
    renderTab();
  } catch (e) { toast(e.message, true); }
}

function addPlan() {
  captureDraft(state.tab);
  applyDrafts(state.current.config);
  state.current.config.plans = state.current.config.plans || [];
  state.current.config.plans.push({ name: 'New Plan', name_ar: 'باقة جديدة', quota: '10 GB', quota_ar: '10 جيجا', price: '60', icon: 'globe' });
  markDirty(true);
  renderTab();
}

function removePlan(i) {
  captureDraft(state.tab);
  applyDrafts(state.current.config);
  state.current.config.plans.splice(i, 1);
  markDirty(true);
  renderTab();
}

// ---------------------------------------------------------------------------
// Words (i18n overrides) + RADIUS Error Translations UI
// ---------------------------------------------------------------------------
function formWords() {
  const wrap = document.createElement('div');

  state.current.config.i18nOverrides = state.current.config.i18nOverrides || {};
  const ov = state.current.config.i18nOverrides;
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = '<h3>قاموس العميل — استبدال كلمات البوابة (i18nOverrides)</h3>' +
    '<div class="planshint">اختر مفتاحاً من القائمة الرسمية، واترك النصوص فارغة لحذف التخصيص.</div>';
  const output = document.createElement('div');
  output.id = 'words-list';

  const renderWords = () => {
    output.innerHTML = '';
    const entries = Object.entries(ov).filter(([k]) => !k.startsWith('_'));
    for (const [key, val] of entries) {
      const en = typeof val === 'object' ? (val.en || '') : val;
      const ar = typeof val === 'object' ? (val.ar || '') : val;
      const row = document.createElement('div');
      row.className = 'card';
      row.style.marginBottom = '10px';
      row.innerHTML =
        '<div class="grid">' +
        '<div class="field"><label>المفتاح</label><select class="w-key">' +
        state.meta.knownKeys.map(k => '<option value="' + esc(k) + '"' + (k === key ? ' selected' : '') + '>' + esc(k) + '</option>').join('') +
        '</select></div>' +
        '<div class="field"><label>إنجليزية</label><input class="w-en" value="' + esc(en) + '"></div>' +
        '<div class="field"><label>عربية</label><input class="w-ar" value="' + esc(ar) + '"></div>' +
        '</div><button class="rowbtn" style="margin-top:8px">إزالة</button>';
      const del = row.querySelector('.rowbtn');
      del.onclick = () => { delete ov[key]; markDirty(true); renderWords(); };
      row.querySelector('.w-key').onchange = (e) => {
        const nk = e.target.value;
        ov[nk] = ov[key]; delete ov[key]; markDirty(true); renderWords();
      };
      row.querySelector('.w-en').oninput = (e) => {
        const currentPair = typeof ov[key] === 'object' ? ov[key] : { en: ov[key] || '', ar: ov[key] || '' };
        currentPair.en = e.target.value;
        ov[key] = currentPair;
      };
      row.querySelector('.w-ar').oninput = (e) => {
        const currentPair = typeof ov[key] === 'object' ? ov[key] : { en: ov[key] || '', ar: ov[key] || '' };
        currentPair.ar = e.target.value;
        ov[key] = currentPair;
      };
      output.appendChild(row);
    }
  };
  renderWords();
  card.appendChild(output);

  const add = document.createElement('button');
  add.className = 'btn ghost addbtn';
  add.textContent = '＋ إضافة كلمة مخصصة';
  add.onclick = () => {
    const firstFree = state.meta.knownKeys.find(k => !(k in ov));
    ov[firstFree || 'login_button'] = { en: '', ar: '' };
    markDirty(true);
    renderWords();
  };
  card.appendChild(add);
  wrap.appendChild(card);

  // --- RADIUS & MikroTik Server Error Translations Card ---
  state.current.config.radiusErrorTranslations = state.current.config.radiusErrorTranslations || {};
  const radMap = state.current.config.radiusErrorTranslations;
  const radCard = document.createElement('div');
  radCard.className = 'card';
  radCard.innerHTML =
    '<h3>ترجمة رسائل أخطاء المايكروتك والـ RADIUS (radiusErrorTranslations)</h3>' +
    '<div class="planshint">تُطابق رسائل الخطأ الإنجليزية القادمة من السيرفر (Reply-Message) وتستبدلها بالرسالة العربية المخصصة للمشترك.</div>' +
    '<datalist id="radius-common-keys">' +
    ['invalid username or password', 'uptime limit reached', 'traffic limit reached', 'simultaneous session limit reached', 'no more sessions are allowed', 'mac address is not yours', 'account expired', 'credit limit reached', 'trial time limit reached', 'radius server is not responding']
      .map(k => '<option value="' + esc(k) + '">').join('') +
    '</datalist>';

  const radList = document.createElement('div');
  radList.id = 'radius-errors-list';

  const renderRadiusErrors = () => {
    radList.innerHTML = '';
    const entries = Object.entries(radMap).filter(([k]) => !k.startsWith('_'));
    entries.forEach(([errKey, arText]) => {
      const row = document.createElement('div');
      row.className = 'card r-row';
      row.style.marginBottom = '8px';
      row.style.padding = '12px';
      row.innerHTML =
        '<div class="grid">' +
        '<div class="field"><label>نص خطأ السيرفر (EN)</label><input class="r-key" list="radius-common-keys" dir="ltr" value="' + esc(errKey) + '"></div>' +
        '<div class="field"><label>الترجمة العربية للمشترك</label><input class="r-val" value="' + esc(arText) + '"></div>' +
        '</div>' +
        '<button class="rowbtn" style="margin-top:8px">حذف الترجمة</button>';
      row.querySelector('.rowbtn').onclick = () => {
        delete radMap[errKey];
        markDirty(true);
        renderRadiusErrors();
      };
      row.querySelector('.r-key').onchange = (e) => {
        const nk = e.target.value.trim();
        if (!nk || nk === errKey) return;
        radMap[nk] = radMap[errKey];
        delete radMap[errKey];
        markDirty(true);
        renderRadiusErrors();
      };
      row.querySelector('.r-val').oninput = (e) => {
        radMap[errKey] = e.target.value;
      };
      radList.appendChild(row);
    });
  };
  renderRadiusErrors();
  radCard.appendChild(radList);

  const radBtnRow = document.createElement('div');
  radBtnRow.style.display = 'flex';
  radBtnRow.style.gap = '8px';
  radBtnRow.style.marginTop = '8px';

  const addRadBtn = document.createElement('button');
  addRadBtn.className = 'btn ghost';
  addRadBtn.textContent = '＋ إضافة ترجمة خطأ RADIUS';
  addRadBtn.onclick = () => {
    const newKey = 'custom error ' + (Object.keys(radMap).length + 1);
    radMap[newKey] = 'رسالة خطأ مخصصة للمشترك.';
    markDirty(true);
    renderRadiusErrors();
  };

  const resetRadBtn = document.createElement('button');
  resetRadBtn.className = 'btn ghost';
  resetRadBtn.textContent = '↺ استعادة الترجمات الافتراضية';
  resetRadBtn.onclick = () => {
    if (state.meta && state.meta.template && state.meta.template.radiusErrorTranslations) {
      state.current.config.radiusErrorTranslations = JSON.parse(JSON.stringify(state.meta.template.radiusErrorTranslations));
      markDirty(true);
      renderTab();
    }
  };

  radBtnRow.appendChild(addRadBtn);
  radBtnRow.appendChild(resetRadBtn);
  radCard.appendChild(radBtnRow);
  wrap.appendChild(radCard);

  return wrap;
}

// ---------------------------------------------------------------------------
// Portal QR Login Tester (dedicated to testing hotspot login QR scanning)
// ---------------------------------------------------------------------------
function formQrTester(c) {
  const wrap = document.createElement('div');

  const testerCard = document.createElement('div');
  testerCard.className = 'card';
  testerCard.innerHTML =
    '<h3>🔍 مختبر رمز QR لتسجيل الدخول (Portal QR Login Tester)</h3>' +
    '<div class="planshint">اختبر مسح رمز الـ QR بكاميرا الهاتف للتأكد من توافق رابط الدخول أو كود الكرت مع ماسح القالب (<code>jsQR</code>) وإعدادات كلمة المرور الحالية.</div>';

  const testerGrid = document.createElement('div');
  testerGrid.className = 'grid';
  testerGrid.appendChild(field('كود الكرت التجريبي', '<input id="v-test-code" data-ignore-dirty="1" value="88442299">'));
  testerGrid.appendChild(field('رابط صفحة الدخول بالراوتر', '<input id="v-test-dns" data-ignore-dirty="1" dir="ltr" value="http://login.meganet.local/login">'));
  testerGrid.appendChild(field('صيغة رمز الـ QR',
    '<select id="v-test-mode" data-ignore-dirty="1">' +
    '<option value="url">رابط دخول تلقائي (كود + كلمة مرور)</option>' +
    '<option value="code">كود الكرت فقط</option>' +
    '</select>'));
  testerCard.appendChild(testerGrid);

  const previewBox = document.createElement('div');
  previewBox.className = 'qr-preview-box';
  previewBox.innerHTML =
    '<div class="qr-svg-wrap" id="v-qr-svg"></div>' +
    '<div style="flex:1;min-width:200px">' +
    '<div style="font-weight:700;font-size:15px;margin-bottom:4px" id="v-card-title">' + esc(c.general.networkName) + '</div>' +
    '<div style="font-family:monospace;font-size:20px;font-weight:700;color:var(--acc);margin-bottom:6px" id="v-card-code">88442299</div>' +
    '<div style="font-family:monospace;font-size:13px;color:var(--text);opacity:.88;word-break:break-all;direction:ltr;text-align:left" id="v-card-payload"></div>' +
    '</div>';
  testerCard.appendChild(previewBox);
  wrap.appendChild(testerCard);

  setTimeout(() => {
    const updateLiveQr = async () => {
      const code = ($('#v-test-code')?.value || '').trim() || '884422';
      const dns = ($('#v-test-dns')?.value || '').trim();
      const mode = $('#v-test-mode')?.value || 'url';
      const passMode = state.current.config.features?.voucherPasswordMode || 'same';
      const payload = (mode === 'url' && dns)
        ? dns + '?username=' + encodeURIComponent(code) + (passMode === 'empty' ? '' : '&password=' + encodeURIComponent(code))
        : code;
      if ($('#v-card-code')) $('#v-card-code').textContent = code;
      if ($('#v-card-payload')) $('#v-card-payload').textContent = payload;
      try {
        const res = await api('/qr?text=' + encodeURIComponent(payload));
        if ($('#v-qr-svg')) $('#v-qr-svg').innerHTML = res.svg;
      } catch {}
    };
    $('#v-test-code')?.addEventListener('input', updateLiveQr);
    $('#v-test-dns')?.addEventListener('input', updateLiveQr);
    $('#v-test-mode')?.addEventListener('change', updateLiveQr);
    updateLiveQr();
  }, 0);

  return wrap;
}

// Auto-crop center square and compress raster image via <canvas>
function autoCropAndCompressImage(file, targetDim) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      try {
        URL.revokeObjectURL(url);
        const side = Math.min(img.width, img.height);
        const sx = Math.floor((img.width - side) / 2);
        const sy = Math.floor((img.height - side) / 2);
        const dim = Math.min(side, targetDim || 128);
        const canvas = document.createElement('canvas');
        canvas.width = dim;
        canvas.height = dim;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, sx, sy, side, side, 0, 0, dim, dim);
        const isPng = /\.png$/i.test(file.name);
        const mime = isPng ? 'image/png' : 'image/jpeg';
        const dataUrl = canvas.toDataURL(mime, 0.82);
        const b64 = dataUrl.split(',')[1];
        resolve(b64);
      } catch (err) { reject(err); }
    };
    img.onerror = () => {
      URL.revokeObjectURL(url);
      reject(new Error('تعذر قراءة الصورة'));
    };
    img.src = url;
  });
}

async function uploadAsset() {
  const file = $('#asset-file').files[0];
  if (!file) return toast('اختر ملفاً أولاً', true);
  const autoCrop = $('#asset-autocrop')?.checked;
  const cropDim = parseInt($('#asset-cropsize')?.value || '128', 10);
  const isRaster = /\.(png|jpe?g|webp)$/i.test(file.name);

  let dataBase64 = '';
  const origKb = Math.max(1, Math.round(file.size / 1024));
  if (autoCrop && isRaster && file.name.toLowerCase() !== 'icon.png') {
    try {
      dataBase64 = await autoCropAndCompressImage(file, cropDim);
    } catch {
      // Fallback to raw bytes if canvas fails in headless environments
    }
  }
  if (!dataBase64) {
    const buf = await file.arrayBuffer();
    const bytes = new Uint8Array(buf);
    let binary = '';
    for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    dataBase64 = btoa(binary);
  }
  const finalKb = Math.max(1, Math.round((dataBase64.length * 3) / 4 / 1024));
  try {
    await api('/profiles/' + encodeURIComponent(state.current.id) + '/assets', {
      method: 'POST',
      body: JSON.stringify({ filename: file.name, dataBase64 })
    });
    toast(autoCrop && isRaster ? `تم رفع وضغط الصورة (${origKb} KB ← ${finalKb} KB)` : 'تم رفع الملف');
    await selectProfile(state.current.id, true);
  } catch (e) { toast(e.message, true); }
}

async function deleteAsset(name) {
  try {
    await api('/profiles/' + encodeURIComponent(state.current.id) + '/assets/' + encodeURIComponent(name), { method: 'DELETE' });
    await selectProfile(state.current.id, true);
  } catch (e) { toast(e.message, true); }
}

async function saveMikrotikSettings(silent = false) {
  if (!state.current) return null;
  const btn = $('#mk-save-btn');
  if (!silent && btn) { btn.disabled = true; btn.textContent = '⏳ جاري الحفظ…'; }
  try {
    const mikrotik = collectMikrotikSettings();
    const res = await api('/profiles/' + encodeURIComponent(state.current.id) + '/mikrotik', {
      method: 'PUT',
      body: JSON.stringify({ mikrotik })
    });
    state.current.mikrotik = res.mikrotik;
    if (res.mikrotik && res.mikrotik.tlsFingerprint) {
      lastRouterFingerprint = res.mikrotik.tlsFingerprint;
      updateTlsBadge(lastRouterFingerprint);
    }
    if (!silent) toast('تم حفظ إعدادات الراوتر لهذا البروفايل');
    return res.mikrotik;
  } catch (e) {
    if (!silent) toast('فشل حفظ إعدادات الراوتر: ' + e.message, true);
    return null;
  } finally {
    if (!silent && btn) { btn.disabled = false; btn.textContent = '💾 حفظ إعدادات الراوتر'; }
  }
}

  const btn = $('#mk-test-btn');
  const box = $('#mk-test-info');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري الفحص…'; }
  try {
    const payload = {
      slug: state.current ? state.current.id : '',
      host: $('#mk-host')?.value?.trim(),
      protocol: $('#mk-proto')?.value || 'http',
      port: Number($('#mk-port')?.value) || 80,
      username: $('#mk-user')?.value?.trim() || 'admin',
      password: $('#mk-pass')?.value || '',
      tlsFingerprint: lastRouterFingerprint || ''
    };
    const info = await api('/mikrotik/test', { method: 'POST', body: JSON.stringify(payload) });
    if (info.tlsFingerprint) {
      lastRouterFingerprint = info.tlsFingerprint;
      updateTlsBadge(lastRouterFingerprint);
    }

    if (info.dhcpServers && info.dhcpServers.length && $('#mk-dhcp-server') && !$('#mk-dhcp-server').value) {
      $('#mk-dhcp-server').value = info.dhcpServers[0].name;
    }
    if (info.hotspotProfiles && info.hotspotProfiles.length && $('#mk-profname')) {
      $('#mk-profname').value = info.hotspotProfiles[0].name;
      if (info.hotspotProfiles[0].dnsName && $('#mk-dns')) {
        $('#mk-dns').value = info.hotspotProfiles[0].dnsName;
      }
      if (info.hotspotProfiles[0].htmlDirectory) {
        if ($('#mk-htmldir')) $('#mk-htmldir').value = info.hotspotProfiles[0].htmlDirectory;
        if ($('#mk-target-dir')) $('#mk-target-dir').value = info.hotspotProfiles[0].htmlDirectory;
      }
    } else if (info.hasFlashPrefix && $('#mk-target-dir') && $('#mk-target-dir').value === 'hotspot') {
      $('#mk-target-dir').value = 'flash/hotspot';
    }
    await refreshRscPreview();
    await saveMikrotikSettings(true);

    const freeMb = info.freeHddSpace ? (info.freeHddSpace / (1024 * 1024)).toFixed(2) + ' MB' : 'غير متاح';
    const sslNote = info.wwwSslEnabled
      ? (info.wwwSslCertificate ? `مفعل (${info.wwwSslCertificate})` : 'مفعل بدون شهادة!')
      : 'غير مفعل';
    if (box) {
      box.style.display = 'block';
      box.innerHTML =
        `✓ متصل بـ <strong>${esc(info.identity)}</strong> (${esc(info.boardName || 'RouterOS')} v${esc(info.version || '?')})<br>` +
        `الفلاش المتاح: <strong>${esc(freeMb)}</strong> · بادئة <code>flash/</code>: <strong>${info.hasFlashPrefix ? 'نعم' : 'لا'}</strong> · خدمة <code>www-ssl</code>: <strong>${esc(sslNote)}</strong>` +
        (info.tlsFingerprint ? `<br>بصمة TLS: <code>${esc(info.tlsFingerprint)}</code>` : '');
    }
    toast('تم فحص الراوتر بنجاح');
  } catch (e) {
    if (box) {
      box.style.display = 'block';
      box.textContent = '✗ تعذر الاتصال بالراوتر: ' + e.message;
    }
    toast('فشل فحص الراوتر: ' + e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔍 فحص الاتصال ومساحة الراوتر'; }
  }
}

async function deployToMikrotik() {
  if (!state.current) return;
  const btn = $('#mk-deploy-btn');
  const statusEl = $('#mk-deploy-status');
  if (btn) { btn.disabled = true; btn.textContent = 'جاري البناء والرفع إلى الراوتر…'; }
  try {
    const saved = await saveConfig();
    if (!saved) return;
    const rscOpts = mikrotikRscParams();
    const payload = {
      host: $('#mk-host')?.value?.trim(),
      protocol: $('#mk-proto')?.value || 'http',
      port: Number($('#mk-port')?.value) || 80,
      username: $('#mk-user')?.value?.trim() || 'admin',
      password: $('#mk-pass')?.value || '',
      targetDir: $('#mk-target-dir')?.value?.trim() || 'hotspot',
      htmlDir: rscOpts.htmlDir,
      dnsName: rscOpts.dnsName,
      profileName: rscOpts.profileName,
      dhcpServer: rscOpts.dhcpServer,
      capportMode: rscOpts.capportMode,
      extraHosts: rscOpts.extraHosts,
      applyRsc: Boolean($('#mk-apply-rsc')?.checked),
      createBackup: Boolean($('#mk-create-backup')?.checked),
      tlsFingerprint: lastRouterFingerprint || ''
    };
    const res = await api('/profiles/' + encodeURIComponent(state.current.id) + '/deploy', {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    if (res.tlsFingerprint) {
      lastRouterFingerprint = res.tlsFingerprint;
      updateTlsBadge(lastRouterFingerprint);
    }
    if (res.mikrotik) state.current.mikrotik = res.mikrotik;
    else syncMikrotikDraft();
    const msg = `✓ تم رفع ${res.uploadedCount} ملف بنجاح إلى ${res.host}:${res.port}/${res.targetDir}` +
      (res.backupCreated ? ' · تم حفظ نسخة احتياطية' : '') +
      (res.rscApplied ? ' · تم تطبيق السكربت' : '');
    if (statusEl) { statusEl.textContent = msg; statusEl.className = 'status ok'; }
    toast(msg);
  } catch (e) {
    if (statusEl) { statusEl.textContent = '✗ فشل الرفع: ' + e.message; statusEl.className = 'status'; }
    toast('فشل الرفع إلى الراوتر: ' + e.message, true);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🚀 بناء ورفع مباشر إلى الراوتر الآن'; }
  }
}

// ---------------------------------------------------------------------------
// Save
// ---------------------------------------------------------------------------
function collectConfig() {
  captureDraft(state.tab);
  const c = state.current.config;
  applyDrafts(c);
  return c;
}

async function saveConfig() {
  if (!state.current) { toast('اختر بريفايل أولاً', true); return false; }
  try {
    const config = collectConfig();
    const data = await api('/profiles/' + encodeURIComponent(state.current.id) + '/config', {
      method: 'PUT',
      body: JSON.stringify({ config })
    });
    state.current = data.profile;

    if (state.drafts.announcements) {
      await api('/profiles/' + encodeURIComponent(state.current.id) + '/announcements', {
        method: 'PUT',
        body: JSON.stringify({ announcements: state.drafts.announcements })
      });
      state.current.announcements = state.drafts.announcements;
    }

    markDirty(false);
    toast('تم الحفظ — الإعدادات سليمة');
    $('#profileMeta').textContent = state.current.assets.length + ' أصول · آخر تحديث ' + (state.current.updatedAt || '').slice(0, 10);
    if (state.sim.open) refreshSimulator(true);
    return true;
  } catch (e) {
    toast(e.message, true);
    if (e.validationErrors) {
      const box = document.createElement('div');
      box.className = 'errorbox';
      box.textContent = 'أخطاء التحقق:\n' + e.validationErrors.join('\n');
      $('#content').prepend(box);
    }
    return false;
  }
}

// ---------------------------------------------------------------------------
// Bundle Size & Flash Memory Meter
// ---------------------------------------------------------------------------
function renderBundleMeter(buildResult, labelPrefix) {
  const meter = $('#bundleMeter');
  if (!meter || !buildResult || !buildResult.zipSize) return;
  meter.className = 'show';
  const zipKb = Math.max(1, Math.round(buildResult.zipSize / 1024));
  const rawKb = Math.max(1, Math.round((buildResult.totalRawSize || buildResult.zipSize) / 1024));
  const pct = Math.min(100, buildResult.flashUsagePercent || Math.round((rawKb / 1024) * 100));
  $('#bm-title').textContent = (labelPrefix || '📦 حجم الحزمة') + ':';
  $('#bm-zip').textContent = 'ZIP: ' + zipKb + ' KB';
  $('#bm-raw').textContent = 'الذاكرة: ' + rawKb + ' KB (' + pct + '% من 1MB)';
  const bar = $('#bm-bar');
  if (bar) {
    bar.style.width = pct + '%';
    bar.style.background = pct > 85 ? 'var(--danger)' : (pct > 60 ? 'var(--warn)' : 'var(--acc)');
  }
  const b = buildResult.breakdown || {};
  $('#bm-breakdown').textContent =
    `HTML: ${Math.round((b.html || 0) / 1024)}KB · أصول: ${Math.round((b.assets || 0) / 1024)}KB · سكربت: ${Math.round((b.scripts || 0) / 1024)}KB · .rsc: ${Math.max(1, Math.round((b.rsc || 0) / 1024))}KB`;
}

// ---------------------------------------------------------------------------
// Build & Batch Build All
// ---------------------------------------------------------------------------
async function buildAndDownload() {
  if (!state.current) return toast('اختر بريفايل أولاً', true);
  if (state.buildBusy) return;
  state.buildBusy = true;
  const btn = $('.btn.primary');
  btn.disabled = true; btn.textContent = 'جاري البناء…';
  try {
    const saved = await saveConfig();
    if (!saved) return;
    const data = await api('/profiles/' + encodeURIComponent(state.current.id) + '/build', { method: 'POST' });
    renderBundleMeter(data, '📦 حجم حزمة ' + state.current.name);
    const a = document.createElement('a');
    a.href = data.downloadUrl;
    a.download = '';
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('تم البناء والتحميل (' + data.distFiles + ' ملف · ' + Math.round((data.zipSize || 0) / 1024) + ' KB)');
  } catch (e) {
    toast('فشل البناء: ' + e.message, true);
  } finally {
    state.buildBusy = false;
    btn.disabled = false; btn.textContent = 'بناء وتحميل zip';
  }
}

async function batchBuildAll() {
  if (state.buildBusy) return;
  state.buildBusy = true;
  const btn = $('#batchBuildBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ جاري بناء الكل…'; }
  try {
    if (state.current && state.dirty) await saveConfig();
    const res = await api('/profiles/build-all', { method: 'POST', body: '{}' });
    if (res.built && res.built.length) {
      const last = res.built[res.built.length - 1];
      renderBundleMeter(last, `⚡ تم بناء ${res.count} بروفايلات (آخرها ${last.name})`);
    }
    toast(`تم بناء جميع البروفايلات بنجاح (${res.count} بروفايل)`);
  } catch (e) {
    toast('فشل البناء الجماعي: ' + e.message, true);
  } finally {
    state.buildBusy = false;
    if (btn) { btn.disabled = false; btn.textContent = '⚡ بناء جميع البروفايلات'; }
  }
}

// ---------------------------------------------------------------------------
// Split-Screen Live Simulator & External Preview (Package 1)
// ---------------------------------------------------------------------------
function renderSimPagesBar() {
  const bar = $('#simPagesBar');
  if (!bar) return;
  bar.innerHTML = SIM_PAGES.map(p =>
    '<button class="sim-page-btn' + (state.sim.page === p.id ? ' active' : '') + '" onclick="setSimPage(\'' + p.id + '\')">' + p.label + '</button>'
  ).join('');
}

function setSimPage(pageId) {
  state.sim.page = pageId;
  renderSimPagesBar();
  updateSimulatorFrame();
}

async function toggleSimulator() {
  const panel = $('#simulatorPanel');
  state.sim.open = !state.sim.open;
  panel.classList.toggle('open', state.sim.open);
  if (state.sim.open) {
    applySimZoom();
    await refreshSimulator(true);
  }
}

function getSimDevice() {
  return SIM_DEVICES[state.sim.device] || SIM_DEVICES.mobile;
}

function applySimZoom() {
  const dev = getSimDevice();
  const z = (state.sim.zoom || 100) / 100;
  const stage = $('#simStage');
  const wrap = $('#simStageWrap');
  const bezel = $('#simBezel');
  const label = $('#simZoomLabel');
  if (bezel) {
    bezel.style.width = dev.width + 'px';
    bezel.style.height = dev.height + 'px';
    bezel.classList.toggle('tablet', dev.id === 'tablet');
  }
  if (stage) {
    stage.style.width = dev.width + 'px';
    stage.style.height = dev.height + 'px';
    stage.style.transform = `scale(${z})`;
  }
  if (wrap) {
    wrap.style.width = Math.round(dev.width * z) + 'px';
    wrap.style.height = Math.round(dev.height * z) + 'px';
  }
  if (label) label.textContent = (state.sim.zoom || 100) + '%';
}

function setSimDevice(deviceId) {
  state.sim.device = SIM_DEVICES[deviceId] ? deviceId : 'mobile';
  const sel = $('#sim-device');
  if (sel && sel.value !== state.sim.device) sel.value = state.sim.device;
  applySimZoom();
}

function setSimTheme(theme) {
  const next = (theme === 'dark' || theme === 'light') ? theme : 'auto';
  state.sim.theme = next;
  const sel = $('#sim-theme');
  if (sel && sel.value !== next) sel.value = next;
  updateSimulatorFrame();
}

function setSimZoom(pct) {
  state.sim.zoom = Math.max(50, Math.min(150, Number(pct) || 100));
  applySimZoom();
}

function stepSimZoom(delta) {
  setSimZoom((state.sim.zoom || 100) + delta);
}

function toggleSimExpand() {
  const panel = $('#simulatorPanel');
  if (!panel) return;
  state.sim.expanded = !state.sim.expanded;
  panel.classList.toggle('expanded', state.sim.expanded);
  const btn = $('#simExpandBtn');
  if (btn) btn.title = state.sim.expanded ? 'إرجاع العرض القياسي' : 'توسيع نافذة المعاينة';
}

(function initSimResizer() {
  const handle = $('#simResizer');
  const panel = $('#simulatorPanel');
  if (!handle || !panel) return;
  let dragging = false;
  let startX = 0;
  let startW = 400;
  handle.addEventListener('mousedown', (e) => {
    e.preventDefault();
    dragging = true;
    startX = e.clientX;
    startW = panel.getBoundingClientRect().width;
    panel.classList.remove('expanded');
    state.sim.expanded = false;
    handle.classList.add('dragging');
    const frame = $('#simFrame');
    if (frame) frame.style.pointerEvents = 'none';
  });
  window.addEventListener('mousemove', (e) => {
    if (!dragging) return;
    const nextW = Math.max(280, Math.min(860, Math.round(startW + (e.clientX - startX))));
    panel.style.width = nextW + 'px';
  });
  window.addEventListener('mouseup', () => {
    if (!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    const frame = $('#simFrame');
    if (frame) frame.style.pointerEvents = '';
  });
})();

async function refreshSimulator(rebuild) {
  try {
    const body = {};
    if (rebuild && state.current) body.slug = state.current.id;
    if (state.sim.port) body.port = state.sim.port;
    const data = await api('/preview', { method: 'POST', body: JSON.stringify(body) });
    state.sim.baseUrl = data.baseUrl || data.url.replace(/\/login\.html$/, '');
    state.sim.port = data.port;
    updateSimulatorFrame();
  } catch (e) { toast('تعذر تشغيل المحاكي: ' + e.message, true); }
}

function updateSimulatorFrame() {
  if (!state.sim.baseUrl) return;
  const lang = $('#sim-lang')?.value || state.sim.lang || 'ar';
  const scenario = $('#sim-scenario')?.value || state.sim.scenario || 'normal';
  const theme = $('#sim-theme')?.value || state.sim.theme || 'auto';
  state.sim.lang = lang;
  state.sim.scenario = scenario;
  state.sim.theme = theme;
  document.cookie = 'hotspot_lang=' + encodeURIComponent(lang) + '; path=/; max-age=31536000; SameSite=Lax';
  if (theme === 'dark' || theme === 'light') {
    document.cookie = 'hotspot_theme=' + encodeURIComponent(theme) + '; path=/; max-age=31536000; SameSite=Lax';
  } else {
    document.cookie = 'hotspot_theme=; path=/; max-age=0; SameSite=Lax';
  }
  const prefix = (lang === 'ar') ? '/ar/' : '/';
  const url = `${state.sim.baseUrl}${prefix}${state.sim.page}.html?scenario=${encodeURIComponent(scenario)}&_t=${Date.now()}`;
  const frame = $('#simFrame');
  if (frame) frame.src = url;
}

let previewUrl = null;
async function togglePreview() {
  try {
    if (previewUrl) {
      await api('/preview/stop', { method: 'POST' });
      previewUrl = null;
      $('#previewBtn').textContent = 'معاينة خارجية';
      return;
    }
    const body = state.current ? { slug: state.current.id } : {};
    const data = await api('/preview', { method: 'POST', body: JSON.stringify(body) });
    previewUrl = data.url;
    state.sim.baseUrl = data.baseUrl || data.url.replace(/\/login\.html$/, '');
    state.sim.port = data.port;
    $('#previewBtn').textContent = 'إيقاف المعاينة';
    window.open(previewUrl, '_blank');
  } catch (e) { toast(e.message, true); }
}

// ---------------------------------------------------------------------------
// Profile CRUD
// ---------------------------------------------------------------------------
async function createProfile() {
  const slug = prompt('معرّف البريفايل (إنجليزي، بدون مسافات):', 'client-' + Date.now().toString(36));
  if (!slug) return;
  const name = prompt('الاسم الظاهر (مثال: كافيه التراس):', slug) || slug;
  const presetOptions = (state.meta && state.meta.presets)
    ? state.meta.presets.map(p => '• ' + p.id + ' : ' + p.label).join('\n')
    : 'meganet, cafe, hotel, clinic, restaurant, gym, netcafe, mall, school, coworking, bakery, mobile-shop';
  const preset = prompt('اختر شخصية القالب (اكتب المعرّف مثل cafe أو hotel أو اتركه فارغاً):\n\n' + presetOptions, 'meganet');
  try {
    const data = await api('/profiles', { method: 'POST', body: JSON.stringify({ slug, name, preset: (preset && preset.trim()) ? preset.trim() : 'meganet' }) });
    await loadProfiles(data.profile.id);
    toast('تم إنشاء البريفايل بنجاح');
  } catch (e) { toast(e.message, true); }
}

async function duplicateProfile(id) {
  const newSlug = prompt('معرّف النسخة الجديدة:', id + '-copy');
  if (!newSlug) return;
  try {
    const data = await api('/profiles/' + encodeURIComponent(id) + '/duplicate', {
      method: 'POST',
      body: JSON.stringify({ newSlug, newName: newSlug })
    });
    await loadProfiles(data.profile.id);
  } catch (e) { toast(e.message, true); }
}

async function renameProfile(id) {
  const name = prompt('الاسم الجديد:', state.profiles.find(p => p.id === id)?.name || id);
  if (!name) return;
  try {
    await api('/profiles/' + encodeURIComponent(id), { method: 'PATCH', body: JSON.stringify({ name }) });
    await loadProfiles(id);
  } catch (e) { toast(e.message, true); }
}

async function deleteProfile(id) {
  if (!confirm('حذف البريفايل نهائياً؟')) return;
  try {
    await api('/profiles/' + encodeURIComponent(id), { method: 'DELETE' });
    state.current = null;
    markDirty(false);
    $('#profileTitle').textContent = 'اختر بريفايل';
    $('#content').innerHTML = '';
    await loadProfiles();
  } catch (e) { toast(e.message, true); }
}

// ---------------------------------------------------------------------------
// Export / Import (transfer a profile between machines, or back it up)
// ---------------------------------------------------------------------------
function exportProfile() {
  if (!state.current) return toast('اختر بريفايل أولاً', true);
  const a = document.createElement('a');
  a.href = '/api/profiles/' + encodeURIComponent(state.current.id) + '/export';
  a.download = '';
  document.body.appendChild(a);
  a.click();
  a.remove();
}

async function importProfile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async () => {
    const f = input.files[0];
    if (!f) return;
    try {
      const bundle = JSON.parse(await f.text());
      const slug = prompt('معرّف البروفايل المستورد:', (bundle.name || 'imported').replace(/\s+/g, '-').toLowerCase().slice(0, 40));
      if (!slug) return;
      const data = await api('/profiles/import', {
        method: 'POST',
        body: JSON.stringify({ slug, name: bundle.name, bundle })
      });
      await loadProfiles(data.profile.id);
      toast('تم الاستيراد');
    } catch (e) { toast(e.message, true); }
  };
  input.click();
}

// ---------------------------------------------------------------------------
boot();
