<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوابة التوليد - ميجا نت</title>
<link rel="stylesheet" href="studio.css">
</head>
<body>

<aside id="studioSidebar" aria-label="قائمة البروفايلات">
  <div class="brand">
    <svg class="brand__icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <circle cx="12" cy="19" r="1.5" fill="currentColor"/>
    </svg>
    <span>بوابة التوليد</span>
    <button type="button" class="iconbtn sidebar-close-btn" id="sidebarCloseBtn" onclick="toggleSidebar(false)" aria-label="إغلاق قائمة البروفايلات">✕</button>
  </div>
  <div class="searchbox">
    <label for="profileSearch" class="sr-only">تصفية البروفايلات</label>
    <input id="profileSearch" type="search" placeholder="تصفية البروفايلات..." oninput="renderProfileList()">
  </div>
  <div id="profileList"></div>
  <button type="button" class="newbtn" onclick="createProfile()">+ بريفايل جديد</button>
  <button type="button" class="newbtn" onclick="batchBuildAll()" id="batchBuildBtn">بناء جميع البروفايلات</button>
  <button type="button" class="newbtn" onclick="exportProfile()">تصدير البروفايل الحالي</button>
  <button type="button" class="newbtn" onclick="importProfile()">استيراد بروفايل</button>
</aside>

<main>
  <header class="top">
    <button type="button" class="btn ghost sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebar()" aria-expanded="false" aria-controls="studioSidebar" aria-label="عرض قائمة البروفايلات">البروفايلات</button>
    <div id="profileTitle">اختر بريفايل</div>
    <span class="badge dirty" id="dirtyBadge" title="توجد تعديلات غير محفوظة (Ctrl+S للحفظ)">تعديلات غير محفوظة</span>
    <span class="badge" id="profileMeta"></span>
    <button type="button" class="btn ghost" onclick="saveConfig()" id="saveBtn" title="حفظ (Ctrl+S)">حفظ</button>
    <button type="button" class="btn primary" id="buildZipBtn" onclick="buildAndDownload()">بناء وتحميل zip</button>
    <button type="button" class="btn ghost" onclick="toggleSimulator()" id="simToggleBtn" aria-expanded="false" aria-controls="simulatorPanel">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <rect x="6" y="2" width="12" height="20" rx="2"/>
        <line x1="12" y1="18" x2="12.01" y2="18"/>
      </svg>
      <span>المحاكي المدمج</span>
    </button>
    <button type="button" class="btn ghost" onclick="togglePreview()" id="previewBtn">معاينة خارجية</button>
  </header>

  <div id="bundleMeter">
    <strong id="bm-title">حجم الحزمة:</strong>
    <span class="badge" id="bm-zip">ZIP: -</span>
    <span class="badge" id="bm-raw">Raw: -</span>
    <div class="flash-bar" title="ميزانية ذاكرة الفلاش في الراوتر (1 MB)"><div class="flash-fill" id="bm-bar" style="width:0%"></div></div>
    <span id="bm-breakdown" class="status"></span>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="workspace-body">
    <div class="content" id="content"></div>

    <section id="simulatorPanel" aria-label="محاكي البوابة المباشر">
      <div id="simResizer" title="اسحب لتكبير أو تصغير عرض المعاينة"></div>
      <div class="sim-head">
        <span>المعاينة المباشرة</span>
        <div class="sim-actions">
          <button type="button" class="rowbtn" id="simZoomOut" onclick="stepSimZoom(-10)" title="تصغير المعاينة" aria-label="تصغير المعاينة">−</button>
          <span id="simZoomLabel" class="sim-zoom-badge">100%</span>
          <button type="button" class="rowbtn" id="simZoomIn" onclick="stepSimZoom(10)" title="تكبير المعاينة" aria-label="تكبير المعاينة">+</button>
          <button type="button" class="rowbtn" id="simZoomReset" onclick="setSimZoom(100)" title="الحجم الطبيعي (100%)" aria-label="إعادة الحجم الطبيعي 100%">1:1</button>
          <button type="button" class="rowbtn" id="simExpandBtn" onclick="toggleSimExpand()" title="توسيع / تضييق نافذة المعاينة" aria-label="توسيع أو تضييق نافذة المعاينة">⛶</button>
          <button type="button" class="rowbtn" onclick="refreshSimulator(true)" title="إعادة البناء وتحديث المعاينة" aria-label="إعادة البناء وتحديث المعاينة">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
          </button>
          <button type="button" class="rowbtn" onclick="toggleSimulator()" title="إغلاق" aria-label="إغلاق المحاكي">✕</button>
        </div>
      </div>
      <div class="sim-controls">
        <div class="sim-group">
          <span class="sim-group__label">مسار الصفحة بالمعاينة</span>
          <div class="sim-pages" id="simPagesBar"></div>
        </div>
        <div class="sim-group">
          <span class="sim-group__label">السيناريو واللغة</span>
          <div class="sim-row">
            <select id="sim-scenario" aria-label="سيناريو المعاينة" onchange="updateSimulatorFrame()">
              <option value="normal">السيناريو: عادي (متصل)</option>
              <option value="error">السيناريو: رسالة خطأ RADIUS</option>
              <option value="trial">السيناريو: فترة تجريبية (Trial)</option>
              <option value="chap">السيناريو: تشفير CHAP</option>
            </select>
            <select id="sim-lang" aria-label="لغة المعاينة" onchange="updateSimulatorFrame()">
              <option value="ar">اللغة: العربية (RTL)</option>
              <option value="en">Language: English (LTR)</option>
            </select>
          </div>
        </div>
        <div class="sim-group">
          <span class="sim-group__label">المظهر والجهاز</span>
          <div class="sim-row">
            <select id="sim-theme" aria-label="ثيم المعاينة" onchange="setSimTheme(this.value)">
              <option value="auto">الثيم: افتراضي البروفايل</option>
              <option value="dark">الثيم: داكن (Dark)</option>
              <option value="light">الثيم: نهاري (Light)</option>
            </select>
            <select id="sim-device" aria-label="حجم شاشة المعاينة" onchange="setSimDevice(this.value)">
              <option value="mobile">الشاشة: موبايل ضيق (340px)</option>
              <option value="wide">الشاشة: موبايل عريض (412px)</option>
              <option value="tablet">الشاشة: تابلت (768px)</option>
            </select>
          </div>
        </div>
      </div>
      <div class="sim-viewport">
        <div id="simStageWrap">
          <div id="simStage">
            <div class="phone-bezel" id="simBezel">
              <div class="phone-notch"></div>
              <iframe id="simFrame" title="معاينة البوابة"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="studio-modal" id="studioModal" role="dialog" aria-modal="true" aria-labelledby="studioModalTitle">
  <div class="studio-modal__box">
    <h3 class="studio-modal__title" id="studioModalTitle"></h3>
    <div class="studio-modal__body" id="studioModalBody"></div>
    <div class="studio-modal__actions">
      <button type="button" class="btn ghost" id="studioModalCancel">إلغاء</button>
      <button type="button" class="btn primary" id="studioModalConfirm">تأكيد</button>
    </div>
  </div>
</div>

<script src="studio-core.js"></script>
<script src="studio-tabs.js"></script>
<script src="studio-mikrotik.js"></script>
<script src="studio-simulator.js"></script>
</body>
</html>
