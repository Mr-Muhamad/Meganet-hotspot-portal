appId: com.meganet.hotspot.studio
productName: Meganet Hotspot Studio
asar: true
asarUnpack:
  - "build/**"
  - "src/**"
  - "scripts/**"
  - "admin/public/**"
  - "config.example.json"
  - "api.json"
  - "md5.js"
directories:
  output: dist-app
extraResources:
  - from: "build/icon.png"
    to: "icon.png"
files:
  - "**/*"
  - "!dist/**"
  - "!dist-app/**"
  - "!dist-release/**"
  - "!docs/**"
  - "!**/*.map"
  - "!tests/**"
  - "!test-results/**"
  - "!playwright-report/**"
  - "!coverage/**"
  - "!*.zip"
  - "!.env"
  - "!.env.*"
  - "!*.tmp"
  - "!*.temp"
  - "!.cache/**"
  - "!icon.png"
  - "!icon1.png"
  - "!AGENTS.md"
  - "!ARCHITECTURE.md"
  - "!CHANGELOG.md"
  - "!CONTRIBUTING.md"
  - "!DESIGN.md"
  - "!README*.md"
  - "!jest.config.js"
  - "!playwright.config.js"
  - "!.eslintrc.json"
  - "!scripts/compose-screenshots.py"
  - "!scripts/build-studio.js"
  - "!scripts/package-portal.js"
  - "!scripts/validate-templates.js"
  # Client data must never ship inside the distributable (profiles carry the
  # clients' configs, WhatsApp numbers and uploaded brand assets).
  - "!.admin/**"
  - "!config.json"
  # config.example.json STAYS in the package: admin/server.js reads it at
  # startup to build the new-profile template.
  - "!.playwright-mcp/**"
  - "!plans/**"
  - "!.github/**"
  - "!.agents/**"
  - "!.zcode/**"
  - "!.mimosa/**"
  - "!.superdesign/**"
  - "!.vscode/**"
  - "!*.log"
  - "!.tmp-preview-server.mjs"
win:
  icon: build/icon.ico
  target:
    - target: portable
      arch:
        - x64
    - target: nsis
      arch:
        - x64
portable:
  artifactName: "${productName}-Portable-${version}.${ext}"
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  artifactName: "${productName}-Setup-${version}.${ext}"
