<svg class="card-header__logo-svg" width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MEGA NET" style="direction: ltr;">
  <title>MEGA NET</title>
  <style>
    /* Brand Styling */
    .core-bg {
      fill: #0f172a;
      transition: fill 0.3s ease;
    }
    :root[data-theme="light"] .core-bg {
      fill: #ffffff;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .core-bg {
        fill: #ffffff;
      }
    }

    .core-m {
      fill: #48ff00;
      filter: drop-shadow(0 0 3px rgba(72, 255, 0, 0.65));
      transition: fill 0.3s ease, filter 0.3s ease;
    }
    :root[data-theme="light"] .core-m {
      fill: #15803d;
      filter: none;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .core-m {
        fill: #15803d;
        filter: none;
      }
    }

    /* Text Logo Styling and Shadows */
    .text-luxury {
      filter: drop-shadow(0 0 4px rgba(0, 212, 255, 0.45));
      transform-origin: left center;
      letter-spacing: 5px;
    }
    :root[data-theme="light"] .text-luxury {
      filter: none;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) .text-luxury {
        filter: none;
      }
    }

    .svg-static-layer {
      display: none;
    }

    .svg-motion-layer {
      display: block;
    }

    /* Motion layer CSS animations (compositor-friendly replacement for SMIL) */
    .prand-net-line-1 {
      animation: prand-dash-rev 2s linear infinite;
    }
    .prand-net-line-2 {
      animation: prand-dash-fwd 3s linear infinite;
    }
    .prand-node {
      transform-box: fill-box;
      transform-origin: center;
      animation: prand-node-pulse 3s ease-in-out infinite;
    }
    .prand-node--alt {
      animation-delay: 1.5s;
    }
    .core-hub-prand {
      animation: prand-hub-float 6s ease-in-out infinite;
    }
    .prand-ring-outer {
      transform-box: fill-box;
      transform-origin: center;
      animation: prand-spin-cw 10s linear infinite;
    }
    .prand-ring-inner {
      transform-box: fill-box;
      transform-origin: center;
      animation: prand-spin-ccw 8s linear infinite;
    }
    .svg-pulse-ring {
      transform-box: fill-box;
      transform-origin: center;
      animation: prand-pulse 2s linear infinite;
    }

    .prand-clip-1 {
      animation: prand-slice-1 6s steps(1, end) infinite;
    }
    .prand-clip-2 {
      animation: prand-slice-2 6s steps(1, end) infinite;
    }
    .prand-glitch-cyan {
      animation: prand-glitch-cyan 6s steps(1, end) infinite;
    }
    .prand-glitch-magenta {
      animation: prand-glitch-magenta 6s steps(1, end) infinite;
    }
    .prand-glitch-base {
      animation: prand-glitch-base 6s steps(1, end) infinite;
    }
    .prand-glitch-slice-1 {
      animation: prand-glitch-slice-1 6s steps(1, end) infinite;
    }
    .prand-glitch-slice-2 {
      animation: prand-glitch-slice-2 6s steps(1, end) infinite;
    }

    @keyframes prand-dash-rev {
      from { stroke-dashoffset: 100; }
      to { stroke-dashoffset: 0; }
    }
    @keyframes prand-dash-fwd {
      from { stroke-dashoffset: 0; }
      to { stroke-dashoffset: 100; }
    }
    @keyframes prand-node-pulse {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.25); }
    }
    @keyframes prand-hub-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes prand-spin-cw {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes prand-spin-ccw {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }
    @keyframes prand-pulse {
      from { transform: scale(1); opacity: 1; }
      to { transform: scale(2.5); opacity: 0; }
    }

    @keyframes prand-slice-1 {
      0%, 52%, 90%, 100% { transform: translateY(0); }
      50% { transform: translateY(48px); }
      51% { transform: translateY(60px); }
      85% { transform: translateY(45px); }
      86% { transform: translateY(65px); }
      88% { transform: translateY(52px); }
    }
    @keyframes prand-slice-2 {
      0%, 52%, 90%, 100% { transform: translateY(0); }
      50% { transform: translateY(58px); }
      51% { transform: translateY(45px); }
      85% { transform: translateY(60px); }
      86% { transform: translateY(48px); }
      88% { transform: translateY(66px); }
    }
    @keyframes prand-glitch-cyan {
      0%, 52%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
      50% { opacity: 0.8; transform: translate(-4px, 2px); }
      51% { opacity: 0.5; transform: translate(3px, -1px); }
      85% { opacity: 0.9; transform: translate(-6px, -2px); }
      86% { opacity: 0.6; transform: translate(5px, 1px); }
      88% { opacity: 0.8; transform: translate(-7px, 2px); }
    }
    @keyframes prand-glitch-magenta {
      0%, 52%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
      50% { opacity: 0.7; transform: translate(4px, -2px); }
      51% { opacity: 0.9; transform: translate(-3px, 1px); }
      85% { opacity: 0.8; transform: translate(6px, 2px); }
      86% { opacity: 0.9; transform: translate(-5px, -1px); }
      88% { opacity: 0.5; transform: translate(7px, -2px); }
    }
    @keyframes prand-glitch-base {
      0%, 52%, 90%, 100% { opacity: 1; transform: translate(0, 0); }
      50% { opacity: 0.6; transform: translate(-2px, 1px); }
      51% { opacity: 0.8; transform: translate(2px, -1px); }
      85% { opacity: 0.4; transform: translate(-4px, 0); }
      86% { opacity: 0.7; transform: translate(4px, 2px); }
      88% { opacity: 0.5; transform: translate(-2px, -2px); }
    }
    @keyframes prand-glitch-slice-1 {
      0%, 52%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
      50% { opacity: 1; transform: translate(-12px, 0); }
      51% { opacity: 1; transform: translate(15px, 0); }
      85% { opacity: 1; transform: translate(-20px, 0); }
      86% { opacity: 1; transform: translate(18px, 0); }
      88% { opacity: 1; transform: translate(-25px, 0); }
    }
    @keyframes prand-glitch-slice-2 {
      0%, 52%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
      50% { opacity: 1; transform: translate(15px, 0); }
      51% { opacity: 1; transform: translate(-10px, 0); }
      85% { opacity: 1; transform: translate(25px, 0); }
      86% { opacity: 1; transform: translate(-20px, 0); }
      88% { opacity: 1; transform: translate(18px, 0); }
    }
  </style>

  <defs>
    <linearGradient id="cyber-grad-prand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0052D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ff0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
    </linearGradient>

    <!-- Cyber Glitch Horizontal Slices -->
    <clipPath id="glitch-slice-1">
      <rect class="prand-clip-1" x="0" y="0" width="400" height="8" />
    </clipPath>

    <clipPath id="glitch-slice-2">
      <rect class="prand-clip-2" x="0" y="0" width="400" height="5" />
    </clipPath>
  </defs>

  <!-- Static fallback for prefers-reduced-motion: reduce -->
  <g class="svg-static-layer" aria-hidden="true">
    <g stroke="#00d4ff" stroke-width="1.5" opacity="0.55" fill="none">
      <path d="M40 60 L90 30 L160 80 L220 40 L290 90 L360 50" stroke-dasharray="10 15" />
      <path d="M40 60 L100 90 L180 30 L250 80 L310 30 L360 50" stroke-dasharray="10 15" />
    </g>
    <g fill="#00d4ff" opacity="0.65">
      <circle cx="40" cy="60" r="4" /><circle cx="90" cy="30" r="3" />
      <circle cx="100" cy="90" r="4" /><circle cx="160" cy="80" r="3" />
      <circle cx="180" cy="30" r="5" /><circle cx="220" cy="40" r="3" />
      <circle cx="250" cy="80" r="4" /><circle cx="290" cy="90" r="3" />
      <circle cx="310" cy="30" r="4" /><circle cx="360" cy="50" r="5" />
    </g>
    <g transform="translate(50, 60)">
      <circle cx="0" cy="0" r="38" fill="none" stroke="url(#cyber-grad-prand)" stroke-width="3" stroke-dasharray="15 5" />
      <circle cx="0" cy="0" r="30" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="10 10" />
      <circle class="core-bg" cx="0" cy="0" r="24" />
      <text class="core-m" x="0" y="15" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" text-anchor="middle" text-rendering="geometricPrecision">M</text>
    </g>
  </g>

  <g class="svg-motion-layer" aria-hidden="true">
    <!-- Network Background -->
    <g stroke="#00d4ff" stroke-width="1.5" opacity="0.6" aria-hidden="true">
      <path class="prand-net-line-1" d="M40 60 L90 30 L160 80 L220 40 L290 90 L360 50" fill="none" stroke-dasharray="10 15" />
      <path class="prand-net-line-2" d="M40 60 L100 90 L180 30 L250 80 L310 30 L360 50" fill="none" stroke-dasharray="10 15" />
    </g>

    <!-- Network Nodes -->
    <g fill="#00d4ff" aria-hidden="true">
      <circle class="prand-node" cx="40" cy="60" r="4" />
      <circle class="prand-node prand-node--alt" cx="90" cy="30" r="3" />
      <circle class="prand-node" cx="100" cy="90" r="4" />
      <circle class="prand-node prand-node--alt" cx="160" cy="80" r="3" />
      <circle class="prand-node" cx="180" cy="30" r="5" />
      <circle class="prand-node prand-node--alt" cx="220" cy="40" r="3" />
      <circle class="prand-node" cx="250" cy="80" r="4" />
      <circle class="prand-node prand-node--alt" cx="290" cy="90" r="3" />
      <circle class="prand-node" cx="310" cy="30" r="4" />
      <circle class="prand-node prand-node--alt" cx="360" cy="50" r="5" />
    </g>

    <!-- Central Digital Core (explicit coordinates avoid SVGO collapsing transform with CSS animation) -->
    <g class="core-hub-prand" aria-hidden="true">
      <!-- Rotating outer rings -->
      <circle class="prand-ring-outer" cx="50" cy="60" r="38" fill="none" stroke="url(#cyber-grad-prand)" stroke-width="3" stroke-dasharray="15 5" />
      <circle class="prand-ring-inner" cx="50" cy="60" r="30" fill="none" stroke="#00d4ff" stroke-width="2" stroke-dasharray="10 10" />
      <!-- Pulse ring -->
      <circle class="svg-pulse-ring" cx="50" cy="60" r="20" fill="none" stroke="#48ff00" stroke-width="2" />
      <circle class="core-bg" cx="50" cy="60" r="24" />
      <text class="core-m" x="50" y="75" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" text-anchor="middle" text-rendering="geometricPrecision">M</text>
    </g>
  </g>

  <!-- Cyber Glitch Effect Text Layers -->
  <g class="text-luxury text-en" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="42" text-rendering="geometricPrecision">
    <!-- Layer 2: Cyan RGB Split -->
    <text class="svg-glitch-layer prand-glitch-cyan" aria-hidden="true" x="108" y="73" fill="#00d4ff" opacity="0">MEGA NET</text>

    <!-- Layer 3: Magenta RGB Split -->
    <text class="svg-glitch-layer prand-glitch-magenta" aria-hidden="true" x="108" y="73" fill="#ff0080" opacity="0">MEGA NET</text>

    <!-- Layer 1: Base Text -->
    <text class="prand-glitch-base" x="108" y="73" fill="currentColor">MEGA <tspan fill="#ff0080">NET</tspan></text>

    <!-- Layer 4: Horizontal Slice 1 (Shifted Left) -->
    <text class="svg-glitch-layer prand-glitch-slice-1" aria-hidden="true" x="108" y="73" fill="currentColor" clip-path="url(#glitch-slice-1)" opacity="0">MEGA <tspan fill="#ff0080">NET</tspan></text>

    <!-- Layer 5: Horizontal Slice 2 (Shifted Right) -->
    <text class="svg-glitch-layer prand-glitch-slice-2" aria-hidden="true" x="108" y="73" fill="currentColor" clip-path="url(#glitch-slice-2)" opacity="0">MEGA <tspan fill="#ff0080">NET</tspan></text>
  </g>
</svg>
