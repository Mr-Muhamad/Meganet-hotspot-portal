{% extends "base.html" %}

{% block content %}
      <div class="card">
        <div class="card-header">
          <svg class="card-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <h1 class="card-header__title" data-i18n="error_title">{{ i18n.error_title }}</h1>
          <p class="card-header__subtitle" data-i18n="error_message">{{ i18n.error_message }}</p>
        </div>

        <div class="card-body">
          <!-- Error Alert -->
          <div class="alert alert-error" role="alert">
            <svg class="alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span class="alert__text" id="errorMessage"><bdi dir="auto">$(error)</bdi></span>
          </div>

          <div class="actions actions--stack mt-lg">
            <a href="./login.html" class="btn btn-primary btn-block">
              <span data-i18n="back_to_login">{{ i18n.back_to_login }}</span>
            </a>
            <button type="button" class="btn btn-secondary btn-block" onclick="toggleSupportModal()">
              <span data-i18n="technical_support">{{ i18n.technical_support }}</span>
            </button>
          </div>

          <div class="footer__device-info mt-md">
            <button type="button" class="device-chip" onclick="copyToClipboard('$(ip)', 'IP')" data-i18n-title="copy_ip_title" title="{{ i18n.copy_ip_title }}">
              IP: <strong class="device-chip__value"><bdi dir="ltr">$(ip)</bdi></strong>
            </button>
            <button type="button" class="device-chip" onclick="copyToClipboard(decodeURIComponent('$(mac-esc)'), 'MAC')" data-i18n-title="copy_mac_title" title="{{ i18n.copy_mac_title }}">
              MAC: <strong id="footer-mac-display" class="device-chip__value"><bdi dir="ltr">$(mac-esc)</bdi></strong> <span id="mac-type-display" class="mac-type-display"></span>
            </button>
          </div>
          <p id="mac-random-hint" class="mac-random-hint" hidden data-i18n="mac_random_warning">{{ i18n.mac_random_warning }}</p>
        </div>
      </div>
{% endblock %}

{% block scripts %}
  <script>
    {% if lang == 'ar' %}
    // RADIUS/User Manager error translation map (from config.json).
    // Consumed by ui.translateRouterError() during initLang()/toggleLang().
    window.HotspotErrorMap = {% if config.radiusErrorTranslations %}{{ config.radiusErrorTranslations | scriptjson }}{% else %}{}{% endif %};
    {% endif %}

    // Initialize modules
    (function() {
      try {
        i18n.init();
        ui.initTheme();
        ui.initLang();
        ui.translateRouterError();

        // Decode footer MAC address if present
        var footerMac = document.getElementById('footer-mac-display');
        if (footerMac) {
          var footerMacTarget = (footerMac.querySelector && footerMac.querySelector('bdi')) || footerMac;
          var rawMacText = footerMacTarget.textContent.trim();
          var decodedMac = '';
          try {
            decodedMac = decodeURIComponent(rawMacText);
          } catch (e) {
            decodedMac = rawMacText.replace(/%3A/gi, ':');
          }
          footerMacTarget.textContent = decodedMac;

          var cleanMac = decodedMac.replace(/[:-]/g, '');
          if (cleanMac.length >= 2) {
            var secondChar = cleanMac.charAt(1).toUpperCase();
            var isRandom = ['2', '6', 'A', 'E'].indexOf(secondChar) !== -1;
            var typeDisplay = document.getElementById('mac-type-display');
            if (typeDisplay) {
              var lang = document.documentElement.getAttribute('lang') || 'en';
              if (isRandom) {
                typeDisplay.textContent = lang === 'ar' ? '(عشوائي)' : '(Random)';
                typeDisplay.classList.add('mac-type-display--random');
                var macHint = document.getElementById('mac-random-hint');
                if (macHint) macHint.hidden = false;
              } else {
                typeDisplay.textContent = lang === 'ar' ? '(الجهاز)' : '(Device)';
                typeDisplay.classList.add('mac-type-display--device');
              }
            }
          }
        }
      } catch (err) {
        console.error('Error page init error:', err);
      }
    })();
  </script>
{% endblock %}
