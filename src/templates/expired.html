{% extends "base.html" %}

{% block content %}
      <div class="card expired-card">
        <div class="card-header expired-header">
          <!-- Hourglass / Suspension Pulse Icon -->
          <svg class="card-header__icon expired-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2v20M17 5H7M17 19H7M12 12a5 5 0 0 1 5-5H7a5 5 0 0 1 5 5zm0 0a5 5 0 0 0 5 5H7a5 5 0 0 0 5-5z"/>
          </svg>
          <h1 class="card-header__title expired-header__title" data-i18n="expired_title">Service Suspended</h1>
          <p class="card-header__subtitle" data-i18n="expired_subtitle">Your internet service has been temporarily stopped</p>
        </div>

        <div class="card-body expired-body">
          <!-- Suspended Notice Alert -->
          <div class="alert alert-warning expired-alert" role="alert">
            <svg class="alert__icon expired-alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span class="alert__text expired-alert__text" data-i18n="expired_alert_text">
              Your subscription balance is finished. Please contact us to renew your service.
            </span>
          </div>

          <!-- Interactive Action Buttons -->
          <div class="expired-actions">
            <!-- Back to Login Button -->
            <a href="./login.html" class="btn btn-secondary btn-block expired-ghost-btn">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
              </svg>
              <span data-i18n="back_to_login">Back to Login</span>
            </a>
          </div>

          <!-- Device MAC and IP Info inside Card Footer style -->
          <div class="footer__device-info">
            <span class="device-chip" onclick="copyToClipboard('$(ip)', 'IP')" title="Click to copy IP">
              IP: <strong class="device-chip__value">$(ip)</strong>
            </span>
            <span class="device-chip" onclick="copyToClipboard(decodeURIComponent('$(mac-esc)'), 'MAC')" title="Click to copy MAC">
              MAC: <strong id="footer-mac-display" class="device-chip__value">$(mac-esc)</strong> <span id="mac-type-display" class="mac-type-display"></span>
            </span>
          </div>
        </div>
      </div>
{% endblock %}

{% block scripts %}
  <script>
    // Initialize modules
    (function() {
      try {
        i18n.init();
        ui.initTheme();
        ui.initLang();

        // Decode footer MAC address if present
        var footerMac = document.getElementById('footer-mac-display');
        if (footerMac) {
          var rawMacText = footerMac.textContent.trim();
          var decodedMac = '';
          try {
            decodedMac = decodeURIComponent(rawMacText);
          } catch (e) {
            decodedMac = rawMacText.replace(/%3A/gi, ':');
          }
          footerMac.textContent = decodedMac;
          
          // Determine MAC type
          var cleanMac = decodedMac.replace(/[:-]/g, '');
          if (cleanMac.length >= 2) {
            var secondChar = cleanMac.charAt(1).toUpperCase();
            var isRandom = ['2', '6', 'A', 'E'].indexOf(secondChar) !== -1;
            var typeDisplay = document.getElementById('mac-type-display');
            if (typeDisplay) {
              var lang = document.documentElement.getAttribute('lang') || 'en';
              if (isRandom) {
                typeDisplay.textContent = lang === 'ar' ? '(عشوائي)' : '(Random)';
                typeDisplay.style.color = '#eab308';
              } else {
                typeDisplay.textContent = lang === 'ar' ? '(الجهاز)' : '(Device)';
                typeDisplay.style.color = '#10b981';
              }
            }
          }
        }
      } catch (err) {
        console.error('Expired page init error:', err);
      }
    })();
  </script>
{% endblock %}
