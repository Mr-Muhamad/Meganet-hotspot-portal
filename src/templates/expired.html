{% extends "base.html" %}

{% block content %}
      <div class="card" style="text-align: center;">
        <div class="card-header" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-sm); margin-bottom: var(--space-md);">
          <!-- Hourglass / Suspension Pulse Icon -->
          <svg class="card-header__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 48px; height: 48px; color: var(--color-warning); animation: status-pulse-dot 2s infinite ease-in-out;">
            <path d="M12 2v20M17 5H7M17 19H7M12 12a5 5 0 0 1 5-5H7a5 5 0 0 1 5 5zm0 0a5 5 0 0 0 5 5H7a5 5 0 0 0 5-5z"/>
          </svg>
          <h1 class="card-header__title" data-i18n="expired_title" style="margin-top: var(--space-xs);">Service Suspended</h1>
          <p class="card-header__subtitle" data-i18n="expired_subtitle">Your internet service has been temporarily stopped</p>
        </div>

        <div class="card-body" style="display: flex; flex-direction: column; gap: var(--space-md); align-items: center; justify-content: center;">
          <!-- Suspended Notice Alert -->
          <div class="alert alert-warning" role="alert" style="width: 100%; display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-md); border-radius: var(--radius-md); text-align: start;">
            <svg class="alert__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--color-warning); flex-shrink: 0; width: 20px; height: 20px;">
              <circle cx="12" cy="12" r="10"/>
              <line x1="12" y1="8" x2="12" y2="12"/>
              <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span class="alert__text" data-i18n="expired_alert_text" style="font-size: var(--font-size-sm); color: var(--color-text); font-weight: var(--font-weight-medium); line-height: var(--line-height-normal);">
              Your subscription balance is finished. Please contact us to renew your service.
            </span>
          </div>

          <!-- Interactive Action Buttons -->
          <div style="display: flex; flex-direction: column; gap: var(--space-sm); width: 100%;">
            <!-- Back to Login Button -->
            <a href="./login.html" class="btn btn-secondary btn-block" style="text-decoration: none; background: transparent; border: 1px dashed var(--color-border); color: var(--color-text-muted);">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
              </svg>
              <span data-i18n="back_to_login">Back to Login</span>
            </a>
          </div>

          <!-- Device MAC and IP Info inside Card Footer style -->
          <div style="font-size: 10px; color: var(--color-text-muted); display: flex; align-items: center; justify-content: center; gap: var(--space-sm); flex-wrap: wrap; width: 100%; border-top: 1px dashed var(--color-border); padding-top: var(--space-sm); margin-top: var(--space-xs);">
            <span style="cursor: pointer; padding: 1px 4px; border-radius: var(--radius-sm); background: var(--color-surface-hover); border: 1px solid var(--color-border); transition: all var(--transition-fast);" onclick="copyToClipboard('$(ip)', 'IP')" title="Click to copy IP">
              IP: <strong style="color: var(--color-text); font-family: monospace;">$(ip)</strong>
            </span>
            <span style="cursor: pointer; padding: 1px 4px; border-radius: var(--radius-sm); background: var(--color-surface-hover); border: 1px solid var(--color-border); transition: all var(--transition-fast);" onclick="copyToClipboard(decodeURIComponent('$(mac-esc)'), 'MAC')" title="Click to copy MAC">
              MAC: <strong id="footer-mac-display" style="color: var(--color-text); font-family: monospace;">$(mac-esc)</strong> <span id="mac-type-display" style="font-size: 8px; font-weight: bold; margin-left: 2px;"></span>
            </span>
          </div>
        </div>
      </div>
{% endblock %}

{% block scripts %}
  <script>
    // Initialize modules
    (function() {
      try {
        i18n.init();
        ui.initTheme();
        ui.initLang();

        // Decode footer MAC address if present
        var footerMac = document.getElementById('footer-mac-display');
        if (footerMac) {
          var rawMacText = footerMac.textContent.trim();
          var decodedMac = '';
          try {
            decodedMac = decodeURIComponent(rawMacText);
          } catch (e) {
            decodedMac = rawMacText.replace(/%3A/gi, ':');
          }
          footerMac.textContent = decodedMac;
          
          // Determine MAC type
          var cleanMac = decodedMac.replace(/[:-]/g, '');
          if (cleanMac.length >= 2) {
            var secondChar = cleanMac.charAt(1).toUpperCase();
            var isRandom = ['2', '6', 'A', 'E'].indexOf(secondChar) !== -1;
            var typeDisplay = document.getElementById('mac-type-display');
            if (typeDisplay) {
              var lang = document.documentElement.getAttribute('lang') || 'en';
              if (isRandom) {
                typeDisplay.textContent = lang === 'ar' ? '(عشوائي)' : '(Random)';
                typeDisplay.style.color = '#eab308';
              } else {
                typeDisplay.textContent = lang === 'ar' ? '(الجهاز)' : '(Device)';
                typeDisplay.style.color = '#10b981';
              }
            }
          }
        }
      } catch (err) {
        console.error('Expired page init error:', err);
      }
    })();
  </script>
{% endblock %}
