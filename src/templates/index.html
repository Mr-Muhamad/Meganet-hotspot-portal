<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" dir="{% if lang == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WiFi Portal</title>
  <script>
    // Route to the portal language matching the browser preference,
    // falling back to the Arabic portal (primary audience).
    (function() {
      var lang = 'en';
      try {
        lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      } catch (err) { /* detection unavailable */ }
      var isArabic = lang.indexOf('ar') === 0;
      {% if lang == 'ar' %}
      window.location.replace(isArabic ? './login.html' : '../login.html');
      {% else %}
      window.location.replace(isArabic ? './ar/login.html' : './login.html');
      {% endif %}
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url={% if lang == 'ar' %}./login.html{% else %}./login.html{% endif %}"></noscript>
</head>
<body>
  <p>Redirecting&hellip;</p>
  <p>
    <a href="{% if lang == 'ar' %}../login.html{% else %}./login.html{% endif %}">English</a> &middot; <a href="{% if lang == 'ar' %}./login.html{% else %}./ar/login.html{% endif %}">العربية</a>
  </p>
</body>
</html>
