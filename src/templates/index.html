<!DOCTYPE html>
<html lang="{{ lang or 'ar' }}" dir="{% if lang == 'en' %}ltr{% else %}rtl{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if lang == 'en' %}WiFi Portal{% else %}بوابة الواي فاي{% endif %}</title>
  <script>
    // Route to the portal language matching explicit cookie, defaulting
    // unconditionally to the Arabic portal unless the user toggled English.
    (function() {
      var saved = '';
      try {
        var m = document.cookie.match(/(?:^|;\s*)hotspot_lang=([^;]+)/);
        if (m) saved = decodeURIComponent(m[1]);
      } catch (err) { /* cookie unavailable */ }

      var goEnglish = saved === 'en';

      var qs = window.location.search || '';
      {% if lang == 'ar' %}
      window.location.replace((goEnglish ? '../login.html' : './login.html') + qs);
      {% else %}
      window.location.replace((goEnglish ? './login.html' : './ar/login.html') + qs);
      {% endif %}
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="0; url={% if lang == 'ar' %}./login.html{% else %}./ar/login.html{% endif %}"></noscript>
</head>
<body>
  <p>{% if lang == 'en' %}Redirecting&hellip;{% else %}جاري التحويل&hellip;{% endif %}</p>
  <p>
    <a href="{% if lang == 'ar' %}../login.html{% else %}./login.html{% endif %}">English</a> &middot; <a href="{% if lang == 'ar' %}./login.html{% else %}./ar/login.html{% endif %}">العربية</a>
  </p>
</body>
</html>
