<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visual Test - Inline SVGs</title>
<style>
  :root {
    --color-bg: #020617;
    --color-surface: #0f172a;
    --color-text: #f8fafc;
    --color-primary: #22c55e;
    --color-primary-hover: #16a34a;
    --color-primary-active: #15803d;
  }
  [data-theme="light"] {
    --color-bg: #f8fafc;
    --color-surface: #ffffff;
    --color-text: #0f172a;
    --color-primary: #16a34a;
    --color-primary-hover: #15803d;
    --color-primary-active: #166534;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui; background: var(--color-bg); color: var(--color-text); min-height: 100vh; padding: 2rem; transition: background 0.3s, color 0.3s; }
  .toolbar { display: flex; gap: 1rem; margin-bottom: 2rem; align-items: center; }
  button { padding: 0.5rem 1rem; border: 1px solid var(--color-text); border-radius: 6px; background: transparent; color: var(--color-text); cursor: pointer; font-size: 14px; }
  button:hover { opacity: 0.8; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
  .card { border: 2px solid var(--color-border, #1e293b); border-radius: 12px; padding: 1.5rem; background: var(--color-surface, #0f172a); }
  .card h2 { margin-bottom: 1rem; font-size: 18px; text-align: center; }
  .card h3 { font-size: 13px; opacity: 0.7; margin-bottom: 0.5rem; text-align: center; }
  .preview { display: flex; align-items: center; justify-content: center; min-height: 200px; padding: 2rem; border-radius: 8px; margin-bottom: 1rem; transition: background 0.3s; }
  .preview-light { background: #f8fafc; }
  .preview-dark { background: #0f172a; }
  .preview-header { display: flex; align-items: center; justify-content: center; gap: 0.5rem; min-height: 80px; padding: 1rem; border-radius: 8px; margin-bottom: 1rem; }
  .header-dark { background: #0f172a; }
  .header-light { background: #f8fafc; }
  .counter-item { margin-bottom: 0.5rem; padding: 0.5rem; background: rgba(255,255,255,0.05); border-radius: 6px; font-size: 12px; font-family: monospace; }
</style>
</head>
<body>
  <div class="toolbar">
    <button onclick="setTheme('light')">☀️ Light Mode</button>
    <button onclick="setTheme('dark')">🌙 Dark Mode</button>
    <span id="status" style="font-size:12px;opacity:0.7;"></span>
  </div>

  <div class="grid">
    <!-- prand-title.svg (inline) -->
    <div class="card">
      <h2>prand-title.svg (inline)</h2>
      <h3>On Light Background</h3>
      <div class="preview preview-light">
        <div id="prand-light">
<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes binaryBlink {0%,100%{opacity:0.2;transform:translateY(0)}50%{opacity:0.8;transform:translateY(-2px)}}
    @keyframes dataStream {0%{transform:translateY(-10px);opacity:0}50%{opacity:0.5}100%{transform:translateY(10px);opacity:0}}
    @keyframes drawM {0%{stroke-dashoffset:120;opacity:0}100%{stroke-dashoffset:0;opacity:1}}
    @keyframes revealText {0%{opacity:0;letter-spacing:20px;transform:translateX(-10px)}100%{opacity:1;letter-spacing:6px;transform:translateX(0)}}
    @keyframes glitch {0%,90%,100%{transform:translateX(0)}92%{transform:translateX(-2px)}94%{transform:translateX(2px)}96%{transform:translateX(-1px)}}
    .binary-digit{animation:binaryBlink 2s infinite ease-in-out;font-family:'Courier New',Courier,monospace;font-size:8px}
    .stream{animation:dataStream 1.5s infinite linear}
    .letter-m{stroke-dasharray:120;stroke-dashoffset:120;animation:drawM 1s ease-in-out 1s forwards}
    .text-luxury{opacity:0;animation:revealText 1.2s cubic-bezier(0.22,1,0.36,1) 1.8s forwards}
    .logo-main{animation:glitch 4s infinite}
  </style>
  <defs>
    <linearGradient id="ptg1" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:var(--color-surface);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--color-bg);stop-opacity:1"/></linearGradient>
    <linearGradient id="ptg2" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:var(--color-primary,#22c55e);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--color-primary-hover,#16a34a);stop-opacity:1"/></linearGradient>
    <linearGradient id="ptg3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:white;stop-opacity:0"/><stop offset="50%" style="stop-color:var(--color-primary,#22c55e);stop-opacity:0.4"/><stop offset="100%" style="stop-color:white;stop-opacity:0"/></linearGradient>
  </defs>
  <g class="logo-main">
    <g transform="translate(30,20)">
      <g fill="var(--color-primary,#22c55e)"><text x="38" y="10" class="binary-digit">1</text><text x="75" y="42" class="binary-digit" style="animation-delay:0.4s">0</text><text x="38" y="75" class="binary-digit" style="animation-delay:0.8s">1</text><text x="5" y="42" class="binary-digit" style="animation-delay:1.2s">0</text><text x="65" y="20" class="binary-digit" style="animation-delay:0.2s">1</text><text x="15" y="20" class="binary-digit" style="animation-delay:0.6s">0</text><text x="65" y="60" class="binary-digit" style="animation-delay:1.0s">1</text><text x="15" y="60" class="binary-digit" style="animation-delay:1.4s">0</text></g>
      <g opacity="0.3"><text x="35" y="30" class="stream" fill="var(--color-primary,#22c55e)" font-size="6" font-family="monospace">101</text><text x="45" y="45" class="stream" fill="var(--color-primary,#22c55e)" font-size="6" font-family="monospace" style="animation-delay:0.5s">010</text><text x="38" y="55" class="stream" fill="var(--color-primary,#22c55e)" font-size="6" font-family="monospace" style="animation-delay:1s">110</text></g>
      <g stroke="url(#ptg2)" stroke-width="1" opacity="0.3"><line x1="40" y1="40" x2="40" y2="10"/><line x1="40" y1="40" x2="75" y2="40"/><line x1="40" y1="40" x2="40" y2="70"/><line x1="40" y1="40" x2="10" y2="40"/></g>
      <path class="letter-m" d="M25 50 L32 25 L40 40 L48 25 L55 50" stroke="url(#ptg2)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g transform="translate(110,65)">
      <text class="text-luxury" font-family="Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-weight="bold" font-size="32" fill="url(#ptg1)" letter-spacing="6">MEGA <tspan fill="var(--color-primary,#22c55e)">NET</tspan></text>
      <rect x="0" y="10" width="180" height="1" fill="url(#ptg2)" opacity="0.5"><animate attributeName="width" values="0;180" dur="1s" begin="1.8s" fill="freeze"/></rect>
      <rect class="glow-rect" x="0" y="-15" width="200" height="40" fill="url(#ptg3)" style="mix-blend-mode:screen"/>
    </g>
  </g>
</svg>
        </div>
      </div>
      <h3>On Dark Background</h3>
      <div class="preview preview-dark">
        <div id="prand-dark">

  <defs><linearGradient id="ptg1b" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:var(--color-surface);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--color-bg);stop-opacity:1"/></linearGradient><linearGradient id="ptg2b" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" style="stop-color:var(--color-primary,#22c55e);stop-opacity:1"/><stop offset="100%" style="stop-color:var(--color-primary-hover,#16a34a);stop-opacity:1"/></linearGradient><linearGradient id="ptg3b" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" style="stop-color:white;stop-opacity:0"/><stop offset="50%" style="stop-color:var(--color-primary,#22c55e);stop-opacity:0.4"/><stop offset="100%" style="stop-color:white;stop-opacity:0"/></linearGradient></defs>

3b)" style="mix-blend-mode:screen"/></g></g>
</svg>
        </div>
      </div>
    </div>

    <!-- logo.svg (inline) -->
    <div class="card">
      <h2>logo.svg (inline)</h2>
      <h3>Header – Dark Background</h3>
      <div class="preview-header header-dark" style="display:flex;align-items:center;gap:0.5rem;">
        <span>
<svg width="28" height="28" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

  <g class="logo-main"><g class="orbit-cw"><circle cx="60" cy="60" r="52" stroke-width="3" fill="none" stroke-dasharray="12,18" opacity=".4"/></g><g class="orbit-ccw"><circle cx="60" cy="60" r="42" stroke-width="3" fill="none" stroke-dasharray="8,15" opacity=".6"/></g><g><path class="m-base" d="M20 85 L35 20 L60 50 L85 20 L100 85" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path class="m-path-active" d="M20 85 L35 20 L60 50 L85 20 L100 85" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><circle class="node" cx="20" cy="85" r="5" style="animation-delay:0s"/><circle class="node" cx="35" cy="20" r="5" style="animation-delay:.2s"/><circle class="node" cx="60" cy="50" r="5" style="animation-delay:.4s"/><circle class="node" cx="85" cy="20" r="5" style="animation-delay:.6s"/><circle class="node" cx="100" cy="85" r="5" style="animation-delay:.8s"/><g transform="translate(60,105)"><text x="-22" y="0" class="letter" font-family="Segoe UI,Roboto,Arial,sans-serif" font-weight="300" font-size="11" style="animation-delay:2.0s">N</text><text x="-8" y="0" class="letter" font-family="Segoe UI,Roboto,Arial,sans-serif" font-weight="300" font-size="11" style="animation-delay:2.3s">E</text><text x="6" y="0" class="letter" font-family="Segoe UI,Roboto,Arial,sans-serif" font-weight="300" font-size="11" style="animation-delay:2.6s">T</text></g></g>
</svg>
        </span>
        <span style="color:#f1f5f9;font-weight:600;">MEGA NET</span>
      </div>
      
      <h3>Header – Light Background</h3>
      <div class="preview-header header-light" style="display:flex;align-items:center;gap:0.5rem;">
        <span>

  <script>
    function setTheme(mode) {
      document.documentElement.setAttribute('data-theme', mode);
      document.getElementById('status').textContent = 'Current: ' + mode + ' mode | --color-primary = ' + getComputedStyle(document.documentElement).getPropertyValue('--color-primary').trim();
    }
    setTheme('dark');
  </script>
</body>
</html>
